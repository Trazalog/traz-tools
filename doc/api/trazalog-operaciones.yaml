openapi: 3.0.3

info:
  title: Trazalog Operaciones API — Trazalog MCP (Unificada)
  version: "1.0.0"
  description: |
    Fachada única de operaciones de Trazalog: Mantenimiento (equipos, órdenes
    de trabajo) y Almacenes (stock, pedidos de materiales). Reemplaza a las
    dos APIs separadas de Sprint 2 (`EquiposAPI-TrazalogMCP`,
    `OrdenesdeTrabajoAPI-TrazalogMCP`) — ver ADR-013.

    **Por qué una sola API:** WSO2 API Manager 4.6.0 genera un Virtual MCP
    Server desde UNA sola API (no combina varias APIs distintas — confirmado
    contra la doc oficial y el entorno real, ver `doc/v3/relevamiento-unificacion-mcp.md`).
    Un cliente MCP (Claude.ai) se conecta una sola vez a esta API y ve las
    9 tools de ambos módulos.

    **Prefijo por módulo en el nombre de la tool:** `man_` (mantenimiento),
    `alm_` (almacenes) — decisión de diseño (ADR-013 #3), no restricción
    técnica. Evita colisiones de nombre entre módulos futuros.	

    **La empresa se determina automáticamente desde el token JWT.**
    No existe ningún parámetro de empresa en ninguna operación — el gateway
    lo inyecta de forma transparente a partir del claim `empr_id` del token
    (vía Key Manager federado con Dnato, ADR-008, y la sequence
    `EmprIdFromHeader` en el MI, ADR-009). El agente nunca pasa ni ve el
    identificador de empresa.

    **Backend:** todas las operaciones son fachada delgada de `toolsMCPAPI`
    (WSO2 MI, context `/tools/mcp`). Las tools de mantenimiento replican
    1:1 la lógica de `toolsMANAPI` (ya probada en producción). Las tools de
    almacenes delegan a `toolsALMAPI` (nuevo, orquestación INSERT+BPM+rollback
    reusable a futuro también desde el PHP de v2).

servers:
  - url: http://10.142.0.13:8280/tools/mcp
    description: WSO2 Micro Integrator — DEV directo (toolsMCPAPI)
  - url: https://{apim_host}:8243/trazalog/mcp/1.0
    description: |
      WSO2 API Manager 4.6.0 — Gateway (PROD/staging). Contexto real
      confirmado 2026-08-08: Rodolfo publicó la API como "Trazalog MCP
      Server", contexto `/trazalog/mcp`, versión `1.0` — no `trazalog-operaciones`
      como sugería ADR-013 originalmente. Endpoint MCP resultante:
      `/trazalog/mcp/1.0/mcp`.
    variables:
      apim_host:
        default: localhost
        description: Host del API Manager

security:
  - bearerAuth: []

tags:
  - name: Mantenimiento
    description: Equipos y Órdenes de Trabajo (Asset Planner)
  - name: Almacenes
    description: Stock y pedidos de materiales

paths:

  # ══════════════════════════════════════════════════════════════
  # MANTENIMIENTO — réplica 1:1 de equipos.yaml + ot.yaml (Sprint 2),
  # rutas prefijadas /mcp/man/... en toolsMCPAPI (ADR-013 #2)
  # ══════════════════════════════════════════════════════════════

  /mcp/man/equipos:
    get:
      operationId: man_get_equipos
      summary: Listar equipos activos de la empresa
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve todos los equipos activos (estado AC o RE, no AN) registrados
        para la empresa del token. Incluye código, descripción, estado
        operativo, sector, grupo funcional, criticidad, marca, área y
        proceso industrial asociado.

        **Cuándo usar esta operación:**
        - Para encontrar el `id_equipo` de un equipo antes de crear una OT.
        - Para ver qué equipos están actualmente en reparación (`estado = RE`).
        - Para obtener el inventario completo de activos y sus sectores.
        - Cuando el usuario menciona el nombre o código del equipo pero no el ID.
      tags:
        - Mantenimiento
      responses:
        "200":
          description: Lista de equipos activos de la empresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquiposList"
              example:
                equipos:
                  equipo:
                    - id_equipo: "10"
                      codigo: "COMP-001"
                      descripcion: "Compresor Atlas Copco GA110"
                      estado: "AC"
                      empr_id: "42"
                      empresa: "Minera San Juan S.A."
                      marca: "Atlas Copco"
                      sector: "Planta Principal"
                      grupo: "Compresores"
                      criticidad: "Alta"
                      area: "Producción"
                      proceso: "Compresión de Aire"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/man/equipo/{equi_id}:
    get:
      operationId: man_get_equipo
      summary: Obtener el detalle técnico de un equipo
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve los datos técnicos completos de un equipo identificado por
        su `id_equipo`. Incluye marca, sector, criticidad, área, proceso
        industrial y estado operativo actual.

        **Cuándo usar esta operación:**
        - Para confirmar los datos de un equipo antes de crear una OT.
        - Para verificar el estado actual (`AC`/`RE`) de un equipo dado.
        - Cuando ya se conoce el `id_equipo` y se necesita el detalle completo.

        Si el equipo no pertenece a la empresa del token, la respuesta contiene
        la estructura vacía `{ "equipo": {} }` sin código de error — garantiza
        el aislamiento multi-empresa sin revelar la existencia de otros registros.
      tags:
        - Mantenimiento
      parameters:
        - name: equi_id
          in: path
          required: true
          description: |
            ID numérico del equipo en Asset Planner. Obtenerlo previamente
            con `man_get_equipos` si solo se conoce el código o nombre.
          schema:
            type: string
            example: "10"
      responses:
        "200":
          description: Datos técnicos del equipo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipoDetalle"
              examples:
                equipo_activo:
                  summary: Equipo activo
                  value:
                    equipo:
                      id_equipo: "10"
                      codigo: "COMP-001"
                      descripcion: "Compresor Atlas Copco GA110"
                      estado: "AC"
                      empr_id: "42"
                      empresa: "Minera San Juan S.A."
                      marca: "Atlas Copco"
                      sector: "Planta Principal"
                      grupo: "Compresores"
                      criticidad: "Alta"
                      area: "Producción"
                      proceso: "Compresión de Aire"
                sin_resultado:
                  summary: Equipo no encontrado o de otra empresa
                  value:
                    equipo: {}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/man/ot:
    post:
      operationId: man_create_ot
      summary: Crear una Orden de Trabajo correctiva
      x-mcp-annotations:
        destructiveHint: true
      description: |
        Crea una solicitud de servicio correctiva para un equipo con falla.
        Cuatro pasos atómicos: (1) INSERT solicitud, (2) obtiene el ID
        generado, (3) instancia el proceso "Proceso de Mantenimiento
        AssetPlanner SIM" en Bonita BPM, (4) vincula el `case_id` a la
        solicitud. Si cualquier paso falla después del INSERT, la solicitud
        se elimina automáticamente (rollback) — nunca queda inconsistente.

        **Cuándo usar esta operación:**
        - Cuando el usuario reporta una falla y solicita abrir una OT.
        - Para registrar formalmente un trabajo de mantenimiento correctivo.

        **Requiere confirmación explícita del usuario antes de ejecutar**
        (dispara un proceso real en Bonita que un mantenedor va a atender).

        Si el usuario describe el equipo por nombre pero no por ID, usar
        primero `man_get_equipos`.
      tags:
        - Mantenimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOTRequest"
            examples:
              falla_compresor:
                summary: Falla en compresor
                value:
                  equipo_id: "10"
                  descripcion: "Ruido inusual en compresor COMP-001. Posible falla en rodamiento."
      responses:
        "200":
          description: OT creada exitosamente. El proceso BPM fue iniciado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOTResponse"
              example:
                resultado: "ok"
                ot_id: "1842"
                case_id: "5301"
                estado: "S"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: man_get_ots
      summary: Listar Órdenes de Trabajo abiertas de la empresa
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve todas las OTs activas de la empresa del token, excluyendo
        anuladas (`AN`) y conformadas-cerradas (`CN`). Incluye equipo
        afectado, sector, mantenedor asignado y fechas clave.

        **Cuándo usar esta operación:**
        - Para ver qué OTs están abiertas actualmente.
        - Antes de confirmar si ya existe una OT abierta para un equipo.
      tags:
        - Mantenimiento
      responses:
        "200":
          description: Lista de OTs abiertas de la empresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTList"
              example:
                solicitudes:
                  solicitud:
                    - id_solicitud: "1842"
                      numero: "OT-2026-1842"
                      estado: "S"
                      id_empresa: "42"
                      equipo: "COMP-001"
                      causa: "Ruido inusual en compresor COMP-001"
                      case_id: "5301"
                      mantenedor: ""
                      f_solicitado: "2026-05-30 18:00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/man/ot/{id_solicitud}:
    get:
      operationId: man_get_ot
      summary: Obtener el detalle completo de una OT
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve el detalle completo de una OT: estado, causa, equipo,
        sector, mantenedor asignado, fechas de inicio/asignación/cierre.

        **Cuándo usar esta operación:**
        - Para confirmar que una OT recién creada se registró bien.
        - Para obtener el `case_id` del proceso BPM asociado.

        Si la OT no pertenece a la empresa del token, devuelve lista vacía
        (aislamiento multi-empresa por SQL, sin código de error).
      tags:
        - Mantenimiento
      parameters:
        - name: id_solicitud
          in: path
          required: true
          description: ID de la OT. Se obtiene como `ot_id` de `man_create_ot` o de `man_get_ots`.
          schema:
            type: string
            example: "1842"
      responses:
        "200":
          description: Detalle de la OT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTList"
              examples:
                ot_recien_creada:
                  summary: OT recién creada
                  value:
                    solicitudes:
                      solicitud:
                        - id_solicitud: "1842"
                          estado: "S"
                          id_empresa: "42"
                          equipo: "COMP-001"
                          case_id: "5301"
                          mantenedor: ""
                no_pertenece:
                  summary: OT de otra empresa
                  value:
                    solicitudes:
                      solicitud: []
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════════
  # ALMACENES — nuevas (E1-ALM), rutas /mcp/alm/... en toolsMCPAPI,
  # que delegan a toolsALMAPI (ADR-013 #1, #2)
  # ══════════════════════════════════════════════════════════════

  /mcp/alm/stock:
    get:
      operationId: alm_get_stock
      summary: Consultar stock de artículos de la empresa
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve el catálogo de artículos de almacén con su stock agregado
        (suma de todos los depósitos) para la empresa del token. Incluye
        código de barras, descripción, unidad de medida, costo y punto de
        pedido.

        **Cuándo usar esta operación:**
        - Para verificar si hay stock de un material antes de armar un pedido.
        - Para consultar el catálogo completo de artículos de almacén.
        - Cuando el usuario pregunta "¿cuánto stock hay de X?".
      tags:
        - Almacenes
      responses:
        "200":
          description: Catálogo de artículos con stock agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockList"
              example:
                materias:
                  materia:
                    - id: "5"
                      barcode: "7791234567890"
                      titulo: "Filtro de aceite"
                      descripcion: "Filtro de aceite hidráulico HF-35"
                      costo: "1200.50"
                      cantidad_caja: "1"
                      punto_pedido: "10"
                      estado: "AC"
                      unidad_medida: "UN"
                      es_loteado: "true"
                      stock: "24"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/alm/depositos:
    get:
      operationId: alm_get_depositos
      summary: Listar los depósitos de la empresa
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve los depósitos (almacenes) de la empresa del token, con el
        establecimiento al que pertenece cada uno.

        **Cuándo usar esta operación:**
        - **Antes de `alm_crear_pedido_materiales`**: esa operación exige un
          `depo_id` por cada artículo, y esta es la única forma de conocerlos.
          No preguntarle al usuario el ID del depósito: consultarlo acá y, si
          hay varios, ofrecerle elegir por nombre.
        - Cuando el usuario pregunta dónde tiene almacenados sus materiales o
          qué depósitos maneja.

        Solo devuelve depósitos no eliminados de la empresa del token.
      tags:
        - Almacenes
      responses:
        "200":
          description: Depósitos de la empresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositosList"
              examples:
                con_depositos:
                  summary: Empresa con varios depósitos
                  value:
                    depositos:
                      deposito:
                        - depo_id: "2000"
                          descripcion: "ALMACEN"
                          esta_id: "6"
                          establecimiento: "Planta Principal"
                        - depo_id: "1000"
                          descripcion: "DEPOSITO_TRANSPORTE"
                          esta_id: "1000"
                          establecimiento: "ESTABLECIMIENTO_TRANSPORTE"
                sin_depositos:
                  summary: Empresa sin depósitos cargados
                  value:
                    depositos: {}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/alm/pedidos:
    get:
      operationId: alm_get_pedidos_materiales
      summary: Listar pedidos de materiales de la empresa
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve todos los pedidos de materiales de la empresa del token
        (no eliminados), con su estado actual, fecha y justificación.

        **Cuándo usar esta operación:**
        - Para ver qué pedidos de materiales están en curso.
        - Antes de crear un pedido nuevo, para verificar si ya existe uno
          similar reciente.
      tags:
        - Almacenes
      responses:
        "200":
          description: Lista de pedidos de materiales de la empresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidosList"
              example:
                pedidos:
                  pedido:
                    - pema_id: "301"
                      case_id: "8801"
                      estado: "Solicitado"
                      fecha: "2026-08-01"
                      justificacion: "Reposición filtros para mantenimiento programado"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/alm/pedido/{pema_id}:
    get:
      operationId: alm_get_pedido_material
      summary: Obtener el detalle de un pedido de materiales
      x-mcp-annotations:
        readOnlyHint: true
      description: |
        Devuelve el detalle completo de un pedido de materiales identificado
        por su `pema_id`, incluyendo el detalle de artículos pedidos.

        **Cuándo usar esta operación:**
        - Para confirmar que un pedido recién creado se registró bien.
        - Para ver el estado y los artículos de un pedido específico.

        Si el pedido no pertenece a la empresa del token, la respuesta
        contiene la lista vacía sin código de error (aislamiento multi-empresa).
      tags:
        - Almacenes
      parameters:
        - name: pema_id
          in: path
          required: true
          description: ID del pedido de materiales. Se obtiene como `pema_id` de `alm_crear_pedido_materiales` o de `alm_get_pedidos_materiales`.
          schema:
            type: string
            example: "301"
      responses:
        "200":
          description: Detalle del pedido de materiales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidosList"
              examples:
                pedido_encontrado:
                  summary: Pedido de la empresa del token
                  value:
                    pedidos:
                      pedido:
                        - pema_id: "301"
                          case_id: "8801"
                          estado: "Solicitado"
                          fecha: "2026-08-01"
                          justificacion: "Reposición filtros para mantenimiento programado"
                no_pertenece:
                  summary: Pedido de otra empresa
                  value:
                    pedidos:
                      pedido: []
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/alm/pedido:
    post:
      operationId: alm_crear_pedido_materiales
      summary: Crear un pedido de materiales
      x-mcp-annotations:
        destructiveHint: true
      description: |
        Crea un pedido de materiales con una lista de artículos, cantidad y
        depósito de destino por cada uno. Tres pasos: (1) INSERT del
        encabezado del pedido, (2) INSERT del detalle de artículos,
        (3) instancia el proceso "Pedido de Recursos Materiales" en Bonita
        BPM y vincula el `case_id`. Si cualquier paso falla, el pedido y su
        detalle se eliminan automáticamente (rollback) — nunca queda
        inconsistente.

        **No mueve stock** — es una solicitud, no un movimiento de
        inventario (ADR-012). No suma ni resta cantidades de artículos.

        **Cuándo usar esta operación:**
        - Cuando el usuario quiere pedir materiales para mantenimiento u
          otra necesidad operativa.
        - Después de confirmar con `alm_get_stock` qué artículos necesita.

        **Requiere confirmación explícita del usuario antes de ejecutar**
        (dispara un proceso real en Bonita que un responsable de almacén
        va a atender).
      tags:
        - Almacenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPedidoRequest"
            examples:
              pedido_simple:
                summary: Pedido de un artículo
                value:
                  justificacion: "Reposición filtros para mantenimiento programado"
                  articulos:
                    - arti_id: "5"
                      cantidad: "10"
                      depo_id: "1"
              pedido_multiple:
                summary: Pedido de varios artículos
                value:
                  justificacion: "Insumos para parada de planta"
                  articulos:
                    - arti_id: "5"
                      cantidad: "10"
                      depo_id: "1"
                    - arti_id: "12"
                      cantidad: "3"
                      depo_id: "2"
      responses:
        "200":
          description: Pedido creado exitosamente. El proceso BPM fue iniciado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrearPedidoResponse"
              example:
                resultado: "ok"
                pema_id: "301"
                case_id: "8801"
                estado: "Solicitado"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por Dnato, firmado con RS256.
        Claims requeridos: `iss="trazalog-dnato"`, `aud="trazalog-mcp"`,
        `empr_id` (string), `exp` (Unix timestamp).
        El gateway valida la firma y extrae `empr_id` — el agente nunca
        lo pasa como parámetro, en ninguna de las 9 tools.

  responses:
    Unauthorized:
      description: Token ausente, expirado, con firma inválida o sin claim `empr_id`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            sin_header:
              value:
                error: "Unauthorized"
                message: "Missing Authorization header"
            expirado:
              value:
                error: "Unauthorized"
                message: "JWT has expired"
    InternalError:
      description: |
        Error en algún paso de la orquestación (DataService o BPM).
        El registro no fue creado (rollback automático si ya se había
        insertado el header).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            respuesta:
              codigo: "1000"
              error: "POST /mcp/alm/pedido - BPM failed, pedido rolled back"

  schemas:

    Equipo:
      type: object
      properties:
        id_equipo: { type: string, example: "10" }
        codigo: { type: string, example: "COMP-001" }
        descripcion: { type: string, example: "Compresor Atlas Copco GA110" }
        estado: { type: string, enum: [AC, RE], example: "AC" }
        empr_id: { type: string, example: "42" }
        empresa: { type: string, example: "Minera San Juan S.A." }
        marca: { type: string, example: "Atlas Copco" }
        sector: { type: string, example: "Planta Principal" }
        grupo: { type: string, example: "Compresores" }
        criticidad: { type: string, example: "Alta" }
        area: { type: string, example: "Producción" }
        proceso: { type: string, example: "Compresión de Aire" }

    EquiposList:
      type: object
      properties:
        equipos:
          type: object
          properties:
            equipo:
              type: array
              items: { $ref: "#/components/schemas/Equipo" }

    EquipoDetalle:
      type: object
      properties:
        equipo: { $ref: "#/components/schemas/Equipo" }

    CreateOTRequest:
      type: object
      required: [equipo_id, descripcion]
      properties:
        equipo_id:
          type: string
          description: ID numérico del equipo con la falla. Usar `man_get_equipos` si solo se conoce el código.
          example: "10"
        descripcion:
          type: string
          description: Descripción clara de la falla o trabajo requerido.
          example: "Ruido inusual en compresor COMP-001."
          minLength: 10
          maxLength: 500

    CreateOTResponse:
      type: object
      properties:
        resultado: { type: string, example: "ok" }
        ot_id: { type: string, example: "1842" }
        case_id: { type: string, example: "5301" }
        estado: { type: string, example: "S" }

    OT:
      type: object
      properties:
        id_solicitud: { type: string, example: "1842" }
        numero: { type: string, example: "OT-2026-1842" }
        estado: { type: string, enum: [S, AC, CN, AN], example: "S" }
        id_empresa: { type: string, example: "42" }
        equipo: { type: string, example: "COMP-001" }
        sector: { type: string, example: "Planta Principal" }
        causa: { type: string, example: "Ruido inusual en compresor COMP-001" }
        case_id: { type: string, example: "5301" }
        mantenedor: { type: string, example: "" }
        f_solicitado: { type: string, format: date-time, example: "2026-05-30 18:00:00" }

    OTList:
      type: object
      properties:
        solicitudes:
          type: object
          properties:
            solicitud:
              type: array
              items: { $ref: "#/components/schemas/OT" }

    ArticuloStock:
      type: object
      properties:
        id: { type: string, example: "5" }
        barcode: { type: string, example: "7791234567890" }
        titulo: { type: string, example: "Filtro de aceite" }
        descripcion: { type: string, example: "Filtro de aceite hidráulico HF-35" }
        costo: { type: string, example: "1200.50" }
        cantidad_caja: { type: string, example: "1" }
        punto_pedido: { type: string, example: "10" }
        estado: { type: string, example: "AC" }
        unidad_medida: { type: string, example: "UN" }
        es_loteado: { type: string, example: "true" }
        stock: { type: string, description: Suma de stock en todos los depósitos., example: "24" }

    StockList:
      type: object
      properties:
        materias:
          type: object
          properties:
            materia:
              type: array
              items: { $ref: "#/components/schemas/ArticuloStock" }

    Deposito:
      type: object
      properties:
        depo_id:
          type: string
          description: ID del depósito. Es el valor que hay que pasar en `depo_id`
            al crear un pedido de materiales.
          example: "2000"
        descripcion:
          type: string
          example: "ALMACEN"
        esta_id:
          type: string
          description: ID del establecimiento al que pertenece.
          example: "6"
        establecimiento:
          type: string
          description: Nombre del establecimiento. Vacío si el depósito no tiene uno asociado.
          example: "Planta Principal"

    DepositosList:
      type: object
      properties:
        depositos:
          type: object
          properties:
            deposito:
              type: array
              items: { $ref: "#/components/schemas/Deposito" }

    ArticuloPedido:
      type: object
      required: [arti_id, cantidad, depo_id]
      properties:
        arti_id:
          type: string
          description: ID del artículo. Obtenerlo con `alm_get_stock`.
          example: "5"
        cantidad:
          type: string
          example: "10"
        depo_id:
          type: string
          description: ID del depósito de destino. **Obtenerlo con `alm_get_depositos`** —
            no preguntárselo al usuario.
          example: "2000"

    CrearPedidoRequest:
      type: object
      required: [justificacion, articulos]
      properties:
        justificacion:
          type: string
          description: Motivo del pedido.
          example: "Reposición filtros para mantenimiento programado"
          minLength: 5
          maxLength: 500
        ortr_id:
          type: string
          description: ID de la Orden de Trabajo relacionada, si el pedido es para atenderla. Opcional.
          example: "1842"
        articulos:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ArticuloPedido" }

    CrearPedidoResponse:
      type: object
      properties:
        resultado: { type: string, example: "ok" }
        pema_id: { type: string, example: "301" }
        case_id: { type: string, example: "8801" }
        estado: { type: string, example: "Solicitado" }

    Pedido:
      type: object
      properties:
        pema_id: { type: string, example: "301" }
        case_id: { type: string, example: "8801" }
        estado: { type: string, example: "Solicitado" }
        fecha: { type: string, format: date, example: "2026-08-01" }
        justificacion: { type: string, example: "Reposición filtros para mantenimiento programado" }

    PedidosList:
      type: object
      properties:
        pedidos:
          type: object
          properties:
            pedido:
              type: array
              items: { $ref: "#/components/schemas/Pedido" }

    ErrorResponse:
      type: object
      properties:
        error: { type: string, example: "Unauthorized" }
        message: { type: string, example: "JWT has expired" }
