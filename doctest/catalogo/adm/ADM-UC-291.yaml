id: ADM-UC-291
modulo: ADM
titulo: Dar de alta una empresa que usa los formularios globales sin copiarlos
perfil: Superusuario
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-017-administracion-formularios-globales.md
    detalle: "secciones '(vii) Disparador de alta' y 'Análisis de impacto en Tools'"
  - repo: traz-tools
    path: _backend/database/scripts/versiones/v2.8.1.3/configuracion_inicial_empresa_trg_func.sql
    detalle: "bloque de clonado de 'Entrega Materiales' (94-129), que se reemplaza"
  - repo: traz-tools
    path: doc/v3/dnato/03_CASOS_DE_PRUEBA.md
    detalle: "escenario CP-127 Alta de empresa"
pantallas:
  - "Consola → Empresas → Nueva empresa"
  - "Tools → Almacenes → Entrega Materiales → Entrega Materiales Directa"
precondiciones:
  - Usuario con sesión iniciada en Tools y la marca de superusuario
  - "'Entrega Materiales' ya es global y publicado y está como 'Global al alta' de formulario_entrega_materiales (ADM-UC-292)"
  - "El punto de uso formulario_checklist_herramientas no tiene 'Global al alta'"
  - "Empresa Test existe desde antes, con su clon de 'Entrega Materiales' y su configuración apuntando a él"
  - "Hay una lista de opciones global (sin empresa) 'turnos' con 'Mañana', 'Tarde' y 'Noche', y el global 'Entrega Materiales' tiene un campo desplegable que la usa [SUPUESTO: lista inventada para la prueba]"
flujo_principal:
  - paso: "Da de alta la empresa 'Nueva SA'"
    resultado: "La empresa se crea como siempre"
  - paso: "Se revisa la configuración de formularios de Nueva SA"
    resultado: "Entrega de materiales apunta al global 'Entrega Materiales', por referencia"
  - paso: "Se revisan los formularios de Nueva SA"
    resultado: "No tiene ningún formulario propio: no se copió nada"
  - paso: "Un responsable de almacén de Nueva SA abre la entrega directa de materiales"
    resultado: "La pantalla dibuja el formulario global 'Entrega Materiales', con los mismos campos que antes tenía el clon"
flujos_alternativos:
  - nombre: "Punto sin global al alta"
    pasos:
      - paso: "Se revisa la configuración de Checklist de herramienta de Nueva SA"
        resultado: "No tiene: esa pantalla dice 'No se especificó un formulario', como hoy"
  - nombre: "Global al alta no publicado"
    pasos:
      - paso: "El superusuario inactiva el global marcado para un punto y da de alta 'Otra SA'"
        resultado: "Otra SA queda sin configuración para ese punto y el alta termina bien"
  - nombre: "Global al alta en pañol"
    pasos:
      - paso: "El superusuario elige un global como 'Global al alta' de formulario_salida_herramientas y da de alta 'Tercera SA'"
        resultado: "Tercera SA queda con la salida de pañol apuntando a ese global"
  - nombre: "Autorregistro"
    pasos:
      - paso: "Una persona se registra y crea su empresa por el autorregistro"
        resultado: "La empresa queda igual que Nueva SA: apunta al global y no tiene formularios copiados"
  - nombre: "Las empresas existentes no cambian"
    pasos:
      - paso: "Se compara la configuración y el clon de Empresa Test antes y después del cambio"
        resultado: "Son iguales; su entrega de materiales sigue dibujando su clon"
  - nombre: "Listas de opciones globales"
    pasos:
      - paso: "Un responsable de almacén de Nueva SA despliega el campo de turnos en la entrega directa"
        resultado: "El desplegable muestra 'Mañana', 'Tarde' y 'Noche', las opciones de la lista global"
      - paso: "Se revisan las listas de opciones antes y después del alta"
        resultado: "Nueva SA tiene su copia de 'turnos'; la lista global y las listas de las demás empresas están igual que antes"
  - nombre: "Campo de lista sin lista global"
    pasos:
      - paso: "El global al alta tiene un campo desplegable con una lista que no existe como global, y se da de alta 'Cuarta SA'"
        resultado: "El alta termina bien; ese campo se ve vacío en Cuarta SA, como hoy"
  - nombre: "Falla en el bloque de formularios"
    pasos:
      - paso: "En la copia de DEMO se fuerza una falla al escribir la configuración y se da de alta una empresa"
        resultado: "La empresa se crea igual y queda un aviso 'CONFINICEMP:' en el registro de la base, como hoy"
validaciones:
  - "El alta escribe la configuración apuntando al global marcado 'al alta' de cada punto"
  - "El alta no crea ningún formulario con la empresa nueva"
  - "Un punto sin global al alta queda sin configuración"
  - "Un global al alta que no está publicado no se usa"
  - "Los puntos de pañol también se configuran si tienen global al alta"
  - "Todos los canales de alta hacen lo mismo"
  - "Las empresas existentes no cambian"
  - "Una falla en ese bloque no frena el alta"
  - "El alta copia a la empresa nueva las listas de opciones globales que usan sus formularios, sin cambiar ninguna lista existente"
  - "Si un campo usa una lista que no existe como global, no se copia nada y el alta sigue"
datos_prueba:
  empresas: "Nueva SA, Otra SA y Tercera SA inventadas, en la copia de DEMO; Empresa Test existente"
dudas:
  - "Antes del cambio, ¿la función del disparador que está en DEMO y en producción es igual a la versión v2.8.1.3 del repositorio? Propuesta: Pablo la compara en DEMO y Rodolfo en producción (solo lectura) antes de escribir la versión nueva; si difieren, se para."
  - "No está claro si las listas que usa hoy 'Entrega Materiales' existen como globales (sin empresa): si existen, son de la 9000 ('9000-<lista>'), y el pase mínimo no las toca. Si es así, al pasar el formulario a global no habría lista global para copiar y sus campos de lista seguirían vacíos. Propuesta: Pablo mira en DEMO, en solo lectura, qué campos de lista tiene ese formulario y dónde están sus listas; si solo están en la 9000, el disparador copia de la lista global y, si no hay, de la de la 9000 con el mismo nombre [SUPUESTO], sin cambiar las de la 9000."
  - "Para ver el resultado del alta hay que mirar la configuración en la base o en 'Dónde se usan' de REQ-015. Propuesta: en DocTest se comprueba por la pantalla 'Dónde se usan' del Portal de la empresa nueva, y además dibujando la entrega directa."
derivados: {}
notas:
  - "Cubre CP-127 (RF-127). Reemplaza el clonado del disparador v2.8.1.3."
  - "Listas de opciones (decidido por Rodolfo el 2026-11-10): la empresa nueva usa las listas globales; como no se toca el dibujo de Tools (que busca la lista con el prefijo de la empresa), el disparador se las copia (filas nuevas en core.tablas)."
  - "Vale para todos los canales de alta (autorregistro de DNATO, alta del superusuario, registración copiada de REQ-003 y Consola de REQ-008), porque todos insertan en core.empresas y disparan el mismo disparador."
