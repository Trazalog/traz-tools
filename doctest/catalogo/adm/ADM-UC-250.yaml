id: ADM-UC-250
modulo: ADM
titulo: Ver y activar o inactivar los formularios de mi empresa
perfil: Administrador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-015-administracion-formularios.md
    detalle: "secciones 'Portal → Formularios (CU-70)' y 'Modelo'"
  - repo: traz-tools
    path: doc/v3/dnato/mockups/empresa-formularios.html
    detalle: "pestaña Formularios y ventana Inactivar"
  - repo: traz-tools
    path: doc/v3/dnato/03_CASOS_DE_PRUEBA.md
    detalle: "escenarios CP-120, CP-128 y CP-130"
pantallas:
  - "Portal de la empresa → 📝 Formularios → Formularios"
precondiciones:
  - "ana@ es administradora de MinTest_SJ"
  - "MinTest_SJ tiene P-1 (publicado, 5 campos, en uso en Entrega de materiales, 12 respuestas) y P-2 (borrador)"
  - "Hay globales G-1 y G-2 publicados y G-3 en borrador; Empresa Test tiene su propio formulario P-9"
flujo_principal:
  - paso: "En el Portal toca '📝 Formularios'"
    resultado: "Ve 'Mis formularios' con P-1 (Publicado, 5 campos, '📦 Entrega de materiales', 12 respuestas) y P-2 (Borrador), y 'Globales disponibles' con G-1 y G-2"
  - paso: "Mira las acciones de los globales"
    resultado: "Cada global tiene 'Vista previa' y '⧉ Usar como base', y ninguno tiene 'Editar'"
  - paso: "Toca 'Inactivar' en P-1"
    resultado: "Se abre 'Inactivar \"P-1\"' con 'Está en uso en Entrega de materiales. Inactivarlo no cambia esas pantallas de Tools: lo van a seguir mostrando hasta que se elija otro formulario en \"Lista de valores\". Las 12 respuestas cargadas se siguen viendo.'"
  - paso: "Toca 'Inactivar'"
    resultado: "P-1 queda 'Inactivo' y 'Dónde se usan' sigue mostrando P-1 en Entrega de materiales, marcado '(inactivo)'"
  - paso: "Abre en Tools un vale de entrega viejo que usó P-1"
    resultado: "Se ve completo, con lo que se cargó"
  - paso: "Abre en Tools la pantalla de entrega de materiales"
    resultado: "Sigue mostrando P-1, igual que antes de inactivarlo: el módulo no cambió la configuración de esa pantalla"
flujos_alternativos:
  - nombre: "Activar de nuevo"
    pasos:
      - paso: "Mira P-1 en 'Mis formularios' después de inactivarlo"
        resultado: "P-1 sigue en la lista, marcado 'Inactivo', con 'Activar' en vez de 'Inactivar'"
      - paso: "Toca 'Activar' en P-1"
        resultado: "P-1 vuelve a 'Publicado' y 'Dónde se usan' lo muestra sin '(inactivo)'"
  - nombre: "Inactivar uno que no está en uso"
    pasos:
      - paso: "Publica P-2 y lo inactiva"
        resultado: "Se inactiva sin la ventana de aviso"
  - nombre: "No se borra nada"
    pasos:
      - paso: "Se revisa la base después de inactivar P-1"
        resultado: "P-1 y sus ítems siguen ahí, con estado inactivo; no hay ninguna fila borrada y la configuración formulario_entrega_materiales de MinTest_SJ está igual que antes"
  - nombre: "Formularios de otra empresa"
    pasos:
      - paso: "ana@ busca P-9 de Empresa Test en la lista"
        resultado: "No aparece"
      - paso: "Escribe a mano la dirección del constructor de P-9"
        resultado: "Ve 'Esa página no existe.'"
  - nombre: "Usuario que no es administrador"
    pasos:
      - paso: "bruno@ entra a la dirección de Formularios"
        resultado: "Ve 'No tenés permiso para entrar a esta pantalla.'"
validaciones:
  - "Se ven los propios de la empresa de la sesión y los globales publicados; los globales en borrador no"
  - "Los formularios inactivos se ven en el ABM marcados 'Inactivo'"
  - "Los globales no se pueden editar desde el Portal"
  - "Inactivar uno en uso avisa en qué lugares se usa y cuántas respuestas tiene, y pide confirmación"
  - "Inactivar no cambia la configuración de las pantallas de Tools: las que lo usan lo siguen mostrando"
  - "Inactivar es baja lógica y las respuestas viejas se siguen viendo"
  - "Un formulario de otra empresa no se ve ni se abre"
  - "Solo el administrador entra"
datos_prueba:
  formularios: "fixture de formularios de 03_CASOS_DE_PRUEBA.md (P-1, P-2, G-1, G-2, G-3), cargado en la copia de DEMO"
dudas:
  - "Los formularios sin empresa que existen hoy en producción no se revisaron (verificación §8.5 del relevamiento, no corrida). Con D1, todos aparecerían como 'globales' para todas las empresas, aunque alguno sea de un cliente. Propuesta: correr la verificación antes de desplegar y no mostrar como globales los que Rodolfo marque como de un cliente. Asignarlos a su cliente era parte de M-7b, que no se hace (decisión de Rodolfo del 2026-11-10): ¿se asignan a mano con un script aparte o se dejan ocultos?"
  - "Inactivar: ¿se usa la columna eliminado que ya existe o el estado nuevo? Hoy nadie pone eliminado en 1 y el dibujo no lo mira (relevamiento §5.2). Propuesta: solo el estado nuevo 'inactivo'; eliminado queda como está, para no cambiar lo que lee FRMDataService (que sí filtra eliminado)."
  - "¿Se impide directamente inactivar un formulario en uso? Como el módulo no puede cambiar la configuración (decisión de Rodolfo del 2026-11-10), un inactivo en uso se sigue mostrando en Tools y el estado 'Inactivo' engaña. Propuesta: sí, impedirlo; 'Inactivar' en uno en uso muestra 'No podés inactivarlo: está en uso en <lugares>. Primero cambiá el formulario de esas pantallas en \"Lista de valores\".' [SUPUESTO] y no cambia nada. Mientras no lo decidas, el caso queda con el aviso y la confirmación."
derivados: {}
notas:
  - "Cubre CP-120, CP-128 (inactivar en uso, baja lógica, respuestas viejas) y CP-130 en las pantallas del módulo. El combo de tareas estándar con '(global)' (D2/D3 en FRMDataService) pasa a REQ-017."
  - "En este plan está prohibido tocar cómo se dibujan los formularios en Tools (decisión de Rodolfo del 2026-11-10): un inactivo se sigue dibujando en Tools (F-4 no se hace) y tampoco se limpia la configuración de los puntos de uso (F-6). Que Tools deje de mostrarlo queda fuera por la prohibición."
