id: ADM-UC-071
modulo: ADM
titulo: Activar, apagar y ordenar funcionalidades
perfil: Administrador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-006-administracion-funcionalidades.md
    detalle: "sección 'Activar, desactivar y ordenar'"
  - repo: traz-tools
    path: doc/v3/dnato/mockups/empresa-funcionalidades.html
    detalle: "interruptores, '⋮⋮' para arrastrar y 'Guardado ✓'"
  - repo: traz-tools
    path: doc/v3/dnato/01_ESPECIFICACION_FUNCIONAL.md
    detalle: "RF-51 a RF-53; CU-31"
pantallas:
  - "Portal de la empresa → Funcionalidades"
precondiciones:
  - Usuario con sesión iniciada, administrador de la empresa activa
  - "La empresa está en Free; Equipos, Órdenes de trabajo y Stock activas en ese orden; Indicadores sin activar"
flujo_principal:
  - paso: "Enciende el interruptor de Indicadores"
    resultado: "Ve 'Guardado ✓'; Indicadores pasa a '✅ Activas', al final"
  - paso: "Arrastra Stock al primer lugar de las activas"
    resultado: "Ve 'Guardado ✓'; el orden queda Stock, Equipos, Órdenes de trabajo, Indicadores, y se mantiene al recargar"
  - paso: "Apaga el interruptor de Órdenes de trabajo"
    resultado: "Ve 'Guardado ✓'; Órdenes de trabajo pasa a '💤 Sin activar'; la auditoría registra quién la apagó"
flujos_alternativos:
  - nombre: "Sale del plan y vuelve"
    pasos:
      - paso: "El superusuario quita Equipos de Free en la matriz y confirma el aviso"
        resultado: "El administrador ve Equipos en '💎 De otros planes'"
      - paso: "El superusuario vuelve a poner Equipos en Free"
        resultado: "El administrador ve Equipos otra vez en '✅ Activas', en el mismo lugar del orden que tenía, sin haber hecho nada"
  - nombre: "Lo nuevo del plan"
    pasos:
      - paso: "El superusuario agrega Ajustes de stock a Free"
        resultado: "El administrador la ve en '💤 Sin activar', nunca activa sola"
  - nombre: "Activar algo de otro plan"
    pasos:
      - paso: "Manda directo al servidor el pedido de activar Procesos, que es de Business"
        resultado: "El servidor lo rechaza con 'Esa funcionalidad no está en tu plan.' y no cambia nada"
  - nombre: "Otra empresa en el pedido"
    pasos:
      - paso: "Manda el pedido de apagar una funcionalidad agregando el número de otra empresa"
        resultado: "Se apaga en la empresa de su sesión; la otra empresa no cambia"
  - nombre: "Falla del servicio"
    pasos:
      - paso: "Con el servicio de datos caído, enciende un interruptor"
        resultado: "Ve 'No pudimos guardar. Probá de nuevo en un rato.' y el interruptor vuelve a como estaba"
validaciones:
  - "Activar, apagar y ordenar se guarda solo"
  - "Una funcionalidad que se activa por primera vez va al final del orden"
  - "Salir del plan y volver conserva la activación y el orden"
  - "Lo que el plan suma aparece sin activar"
  - "Solo se activa lo que está en el plan; el servidor rechaza lo demás"
  - "La empresa sale de la sesión"
  - "Si el servicio falla, la pantalla lo dice y no queda a medias"
datos_prueba:
  empresa: "empresa de prueba con plan_id de Free cargado a mano (el cambio de plan de una empresa es REQ-008)"
dudas:
  - "Hasta M-4 (REQ-009) las empresas existentes no tienen ninguna fila en seg.empresas_funcionalidades, así que verían todo 'sin activar'. Propuesta: adelantar M-4 a este requerimiento (pasa a 🔴, con script aprobado por Rodolfo) para que Funcionalidades muestre lo que cada empresa usa hoy; si no, el Portal no publica Funcionalidades en DEMO hasta REQ-009."
  - "RF-100 no nombra la activación ni el orden entre lo que se audita. Propuesta: auditar activar y apagar (funcionalidad.activar, funcionalidad.desactivar), porque alimentan los avisos del Inicio del Portal (REQ-013), y no auditar cada cambio de orden."
  - "¿El orden es uno solo para toda la empresa o uno por módulo? R3 dice que el predeterminado respeta la jerarquía del catálogo (módulo → opción). Propuesta: un solo orden de la lista; el menú predeterminado agrupa por módulo y dentro de cada módulo usa este orden."
  - "¿Una funcionalidad que se activa por primera vez va al final o en el lugar que le da el catálogo? Propuesta: al final; el administrador la mueve si quiere."
derivados: {}
notas:
  - "Cubre la parte de CU-31 sin menús custom, CP-14 (activación y orden se conservan) y CP-52 (bajar y volver a subir), probados con la matriz de REQ-005 porque el cambio de plan de una empresa es REQ-008."
  - "El aviso 'Está en N menús' al apagar (CU-31 A1, CP-51) lo agrega REQ-009."
