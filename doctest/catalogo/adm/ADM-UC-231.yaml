id: ADM-UC-231
modulo: ADM
titulo: Cargar una planilla y ver el resultado en el historial
perfil: Administrador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-014-administracion-cargas-masivas.md
    detalle: "secciones 'Entidades de Tools', 'Historial' y 'Datos'"
  - repo: traz-tools
    path: doc/v3/dnato/mockups/empresa-cargas.html
    detalle: "'Historial de cargas' y 'Resultado'"
  - repo: traz-tools
    path: doc/v3/dnato/DNATO_v2_RELEVAMIENTO.md
    detalle: "§4.1 'Detalle de la carga masiva (A-21)'"
pantallas:
  - "Portal de la empresa → 🗂️ Cargas masivas"
precondiciones:
  - "ana@ es administradora de MinTest_SJ"
  - "Tiene una planilla de artículos de 123 filas, 3 con errores (unidad de medida 'KGS' que no existe, código 'ART-0099' repetido, familia 'Lubricantes 2' que no existe)"
flujo_principal:
  - paso: "Elige 'Artículos', adjunta la planilla y toca 'Procesar carga'"
    resultado: "Ve 'Listo: 120 ok · 3 con error.' y el resultado 'Resultado · Artículos · <fecha>' con una fila por error: Fila, Nivel y Mensaje"
  - paso: "Toca '⬇ CSV' del resultado"
    resultado: "Baja el detalle de los errores"
  - paso: "Mira el 'Historial de cargas'"
    resultado: "La carga aparece arriba con la fecha, 'ana@', 'Artículos', 120 ok y 3 con error"
  - paso: "Cierra sesión, vuelve a entrar y abre Cargas masivas"
    resultado: "La carga sigue en el historial; al tocarla ve el mismo resultado"
flujos_alternativos:
  - nombre: "Sin entidad"
    pasos:
      - paso: "Adjunta la planilla sin elegir entidad y toca 'Procesar carga'"
        resultado: "Ve 'Elegí qué vas a cargar.' y no se procesa nada"
  - nombre: "Sin archivo"
    pasos:
      - paso: "Elige la entidad y toca 'Procesar carga' sin adjuntar nada"
        resultado: "Ve 'Elegí el archivo que vas a cargar.'"
  - nombre: "Archivo que no es planilla"
    pasos:
      - paso: "Adjunta un .pdf"
        resultado: "Ve 'Formato de archivo no válido. Solo se permiten archivos Excel (.xlsx, .xls)' y no se procesa nada"
  - nombre: "Los datos van a la empresa de la sesión"
    pasos:
      - paso: "Procesa la carga mandando, a propósito, el número de otra empresa en el envío"
        resultado: "Los artículos quedan en MinTest_SJ"
  - nombre: "Solo el historial de mi empresa"
    pasos:
      - paso: "La administradora de Yudica abre Cargas masivas"
        resultado: "No ve la carga de MinTest_SJ"
  - nombre: "Una carga no se borra"
    pasos:
      - paso: "Busca cómo borrar o deshacer una carga del historial"
        resultado: "No hay forma: el historial es solo de lectura"
validaciones:
  - "La entidad y el archivo son obligatorios"
  - "Solo se aceptan .xlsx y .xls"
  - "Los datos se cargan en la empresa de la sesión"
  - "Cada carga queda en el historial con quién, cuándo, entidad, filas ok, filas con error y el detalle"
  - "El historial muestra solo las cargas de la empresa de la sesión"
  - "Una carga no se borra ni se deshace"
datos_prueba:
  planilla: "artículos de prueba con prefijo ART-TEST-, en la base de prueba"
dudas:
  - "DNATO-UC-027 (validado por vos el 2026-08-24) dice 'la carga es todo o nada: si alguna fila tiene un error, no se carga ninguna'. La especificación (RF-110, nota de la maqueta) dice 'la carga parcial por fila se mantiene', y el relevamiento muestra que el procedimiento de artículos carga las filas buenas y cuenta las malas (bulkload_articulos.sql:65-79). ¿Cuál vale? Propuesta: no cambiar ningún procedimiento; el módulo muestra lo que cada uno hizo (ok y con error) y corregimos DNATO-UC-027 cuando lo confirmes en la copia de DEMO."
  - "Los procedimientos leen el archivo con COPY desde el servidor de PostgreSQL, así que el archivo tiene que estar en una carpeta que la base pueda leer (hoy la de DNATO, dentro del sitio web). Con la base en otra máquina deja de andar. Propuesta: usar la misma carpeta de DNATO en cada ambiente, fuera de la parte pública del sitio si se puede, y anotarlo para la infraestructura nueva."
  - "¿La carga deja una fila en la auditoría? RF-100 no la nombra. Propuesta: no; tiene su propio historial (como el consumo de IA). Los usuarios que crea sí dejan su miembro.invitar."
  - "Solicitantes de transporte crea una empresa por cada solicitante (POST API_CORE/empresa) desde el PHP de DNATO. Propuesta: el módulo copia ese paso tal cual; no usa la librería de alta de empresa de REQ-008 porque eso cambiaría lo que hace."
derivados: {}
notas:
  - "Equivale a DNATO-UC-027 (camino PostgreSQL) en la nueva pantalla, con historial persistente (RF-110)."
