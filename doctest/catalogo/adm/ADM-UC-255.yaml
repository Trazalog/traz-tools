id: ADM-UC-255
modulo: ADM
titulo: Mantener los formularios globales y los puntos de uso
perfil: Superusuario
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-015-administracion-formularios.md
    detalle: "sección 'Consola → Formularios globales (CU-75, RF-121)'"
  - repo: traz-tools
    path: doc/v3/dnato/mockups/consola-formularios.html
    detalle: "pestañas Globales y Puntos de uso"
  - repo: traz-tools
    path: doc/v3/dnato/03_CASOS_DE_PRUEBA.md
    detalle: "escenario CP-131 Consola"
pantallas:
  - "Consola → 📝 Formularios globales"
  - "Constructor de formularios (Consola)"
precondiciones:
  - Usuario con sesión iniciada en Tools y la marca de superusuario
  - "G-1 lo usan por referencia 2 empresas y tiene 1 copia; G-2 lo usan 3 empresas en Salida y Recepción de pañol; G-3 está en borrador"
flujo_principal:
  - paso: "En la Consola toca '📝 Formularios globales'"
    resultado: "Ve 'Formularios globales' y la tabla con G-1 (Publicado, 2 empresas, 1 copia), G-2 y G-3 (Borrador)"
  - paso: "Toca '＋ Nuevo global', arma 'Checklist de herramienta' con un campo de lista desde servicio y lo publica"
    resultado: "El global queda publicado; la paleta de la Consola ofrece los tipos avanzados"
  - paso: "Toca 'Inactivar' en G-2"
    resultado: "Ve 'Lo usan por referencia 3 empresas en Salida y Recepción de pañol. Inactivarlo no cambia esas pantallas de Tools: lo van a seguir mostrando. Las copias no se tocan.' con 'Cancelar' / 'Inactivar'"
  - paso: "Confirma"
    resultado: "G-2 queda Inactivo; la configuración de esas tres empresas no cambia (siguen con G-2 en esos puntos) y las copias de G-2 siguen igual"
  - paso: "Abre la pestaña 'Puntos de uso' y elige G-1 como 'Global al alta' de formulario_entrega_materiales"
    resultado: "Se guarda y queda en la auditoría"
flujos_alternativos:
  - nombre: "Administrador que no es superusuario"
    pasos:
      - paso: "Un administrador entra a la dirección de Formularios globales"
        resultado: "Ve 'No tenés permiso para entrar a esta pantalla.'"
      - paso: "Manda, a propósito, un formulario con empresa vacía (global) desde el Portal"
        resultado: "Se rechaza: desde el Portal solo se guardan formularios de su empresa"
  - nombre: "Nuevo punto de uso"
    pasos:
      - paso: "Toca '＋ Punto de uso' y carga clave, pantalla y módulo"
        resultado: "El punto aparece, solo para leer, en 'Dónde se usan' de todas las empresas, con 'Ninguno' donde la empresa no tiene configuración"
  - nombre: "El formulario del autorregistro"
    pasos:
      - paso: "Busca el formulario del registro de usuario"
        resultado: "Se ve con 'lo usa el autorregistro' y solo 'Vista previa', sin 'Editar' ni 'Inactivar'"
validaciones:
  - "La Consola muestra los globales con estado, campos, empresas que lo usan y copias"
  - "Solo el superusuario crea y edita globales y usa los tipos avanzados"
  - "Inactivar un global en uso avisa cuántas empresas lo usan y no cambia la configuración de ninguna empresa"
  - "Las copias de un global no se tocan al inactivarlo"
  - "Los puntos de uso tienen su global al alta"
  - "El formulario del autorregistro no se puede editar desde acá"
datos_prueba:
  globales: "G-1, G-2, G-3 del fixture de 03_CASOS_DE_PRUEBA.md, en la copia de DEMO"
dudas:
  - "¿Se impide inactivar un global que usan empresas, igual que se pregunta para el Portal (ADM-UC-250)? La Consola no puede limpiar la configuración de esas empresas (decisión de Rodolfo del 2026-11-10), así que lo siguen mostrando. Propuesta: misma respuesta que en ADM-UC-250; si se impide, el mensaje lista cuántas empresas y en qué puntos lo usan."
  - "Hasta que se construya REQ-017, el 'Global al alta' se guarda pero nadie lo usa: el alta de empresa sigue clonando 'Entrega Materiales' desde la 9000. Si REQ-015 se despliega antes que REQ-017, ¿mostramos igual la columna 'Global al alta'? Propuesta: sí, con la leyenda 'Se va a usar cuando el alta de empresa escriba la configuración (todavía clona desde la empresa plantilla).'"
  - "El formulario del autorregistro lo usa el registro (núcleo, hoy con número fijo). Propuesta: en este plan solo se ve (registración = núcleo, y no se toca cómo se dibuja ni se completa en Tools); editarlo queda para cuando Rodolfo lo decida."
derivados: {}
notas:
  - "Cubre CP-131. CP-127 y la parte mínima de CP-132 pasan a REQ-017 (cambio del disparador y pase a globales de los formularios de la 9000 que usa); el resto de CP-132 (M-7b) no se hace."
