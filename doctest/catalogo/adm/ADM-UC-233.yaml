id: ADM-UC-233
modulo: ADM
titulo: Cargar usuarios desde una planilla sin pasar el tope del plan
perfil: Administrador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-014-administracion-cargas-masivas.md
    detalle: "sección 'Usuarios (entidad del módulo, CP-77)' y 'Decisiones tomadas'"
  - repo: traz-tools
    path: requerimientos/REQ-007-administracion-usuarios-roles-perfil.md
    detalle: "modelo Membresias e invitar (rama feature/req-007-administracion-usuarios-roles-perfil)"
  - repo: traz-tools
    path: doc/v3/dnato/03_CASOS_DE_PRUEBA.md
    detalle: "escenario CP-77 Carga masiva"
pantallas:
  - "Portal de la empresa → 🗂️ Cargas masivas"
  - "Portal de la empresa → 👥 Usuarios"
precondiciones:
  - "MinTest_SJ tiene un plan con tope de 5 usuarios (cargado a mano en la base de prueba, porque M-3 es REQ-016) y usa 3 de 5 lugares"
  - "ana@ tiene una planilla de 4 usuarios nuevos con rol Mantenedor"
flujo_principal:
  - paso: "ana@ elige 'Usuarios'"
    resultado: "Ve 'ℹ️ Si la planilla crea usuarios, se respeta el tope de tu plan (3 de 5 hoy): los que no entren quedan rechazados en el resultado.'"
  - paso: "Adjunta la planilla y toca 'Procesar carga'"
    resultado: "Ve 'Listo: 2 ok · 2 con error.'; el resultado dice, para las dos últimas filas, 'Tope del plan: no hay lugar para <correo>.'"
  - paso: "Mira el historial"
    resultado: "La carga figura con 'Usuarios', 2 ok y 2 con error, marcada 'tope'"
  - paso: "Abre Usuarios"
    resultado: "Las dos primeras personas aparecen como 'Invitado · vence <fecha>' y el contador dice 5 de 5"
flujos_alternativos:
  - nombre: "Fila inválida"
    pasos:
      - paso: "Carga una planilla con un correo mal escrito, un correo repetido y un rol que no existe"
        resultado: "Esas filas quedan con error y su motivo, sin crear nada para ellas; las válidas se invitan si hay lugar"
  - nombre: "Ya es miembro"
    pasos:
      - paso: "Una fila tiene el correo de alguien que ya es miembro de la empresa"
        resultado: "Esa fila queda con error con el mismo mensaje que da Usuarios al invitarlo"
  - nombre: "Tope ya alcanzado"
    pasos:
      - paso: "Con 5 de 5 lugares, carga una planilla de 2 usuarios"
        resultado: "Las dos filas quedan con error por tope y no se crea nada"
  - nombre: "Empresa sin tope"
    pasos:
      - paso: "La administradora de una empresa sin plan carga 4 usuarios"
        resultado: "Se invitan los 4 y no aparece el aviso del tope"
validaciones:
  - "Cada fila válida se invita con la misma operación de Usuarios del Portal"
  - "Lo que no entra en el tope queda rechazado con 'tope del plan' y no se crea"
  - "Las filas inválidas se rechazan con su motivo sin crear nada"
  - "Lo que ya es miembro se rechaza como en Usuarios"
  - "La carga es parcial: lo que entró, queda"
  - "Sin tope, se invitan todos"
datos_prueba:
  planilla: "4 correos inventados del dominio de prueba (por ejemplo carga1@doctest.invalid a carga4@doctest.invalid)"
dudas:
  - "REQ-007 dejó para acá decidir si la operación de invitar pasa a una API (la regla del repo pide la lógica de negocio en las APIs). Propuesta: en este requerimiento sigue en el modelo Membresias del módulo, que ya usan Portal, Consola y ahora la carga (un solo código); pasarla a una API nueva va en un requerimiento aparte, cuando el agente de IA tenga que invitar, porque necesita los datos de la sesión de Bonita que hoy aporta el PHP y una API nueva es núcleo."
  - "¿Cuántas filas puede tener una planilla de usuarios? Cada fila llama a la API de alta (Bonita y AssetPlanner) y manda un correo. Propuesta: hasta 100 filas por carga; más, se rechaza el archivo con 'La planilla de usuarios puede tener hasta 100 filas.'"
  - "Si el correo de una invitación no sale, en Usuarios se muestra el enlace para copiar. En la carga no hay dónde. Propuesta: la fila queda ok con el aviso 'No pudimos mandar el correo; reenviá la invitación desde Usuarios.'"
derivados: {}
notas:
  - "Cubre CP-77 (parte del tope y del historial) y RF-72 en la carga masiva."
