id: ADM-UC-254
modulo: ADM
titulo: Elegir qué formulario muestra cada pantalla de Tools
perfil: Administrador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-015-administracion-formularios.md
    detalle: "sección 'Dónde se usan (CU-74, RF-126)'"
  - repo: traz-tools
    path: doc/v3/dnato/mockups/empresa-formularios.html
    detalle: "pestaña 'Dónde se usan'"
  - repo: traz-tools
    path: doc/v3/dnato/FORMULARIOS_DINAMICOS_RELEVAMIENTO.md
    detalle: "§3.2 mecanismo A (configuraciones/formulario_<punto> en core.tablas)"
pantallas:
  - "Portal de la empresa → 📝 Formularios → Dónde se usan"
  - "Tools → Almacenes → Entrega de materiales"
  - "Tools → Pañol → Checklist de herramienta"
precondiciones:
  - "ana@ es administradora de MinTest_SJ"
  - "Entrega de materiales de MinTest_SJ usa P-1; G-1 es un global publicado; 'Inspección de equipo' está en borrador"
  - "MinTest_SJ tiene un proceso y una tarea estándar con formulario elegido en su ABM"
flujo_principal:
  - paso: "En Formularios toca la pestaña 'Dónde se usan'"
    resultado: "Ve 'Qué formulario muestra cada pantalla de Tools en tu empresa.' y una fila por pantalla (Entrega de materiales, Salida de pañol, Recepción de pañol, Checklist de herramienta) con su módulo y el formulario elegido"
  - paso: "En Entrega de materiales cambia P-1 por '🌐 G-1 (global)' y toca 'Guardar'"
    resultado: "Se guarda y queda en la Actividad de la empresa"
  - paso: "Abre en Tools la entrega directa de materiales"
    resultado: "La pantalla dibuja G-1"
  - paso: "Mira la parte 'Elegidos en su propio ABM (solo lectura)'"
    resultado: "Ve el proceso y la tarea estándar con su formulario y 'Ir a Procesos →', 'Ir a Tareas estándar →', sin poder cambiarlos desde acá"
flujos_alternativos:
  - nombre: "Ninguno"
    pasos:
      - paso: "En Checklist de herramienta elige 'Ninguno' y guarda"
        resultado: "Ve 'La pantalla quedará sin formulario' y, al confirmar, se guarda"
      - paso: "Abre el checklist de una herramienta en Tools y guarda"
        resultado: "La pantalla dice 'No se especificó un formulario' y guarda sin formulario, como hoy"
  - nombre: "Un borrador no se puede elegir"
    pasos:
      - paso: "Abre el selector de Checklist de herramienta"
        resultado: "'Inspección de equipo' aparece deshabilitado con '(propio · borrador, publicalo primero)'"
      - paso: "Manda, a propósito, el número de 'Inspección de equipo' en el envío"
        resultado: "Se rechaza y la configuración no cambia"
  - nombre: "Formulario de otra empresa"
    pasos:
      - paso: "Manda, a propósito, el número de un formulario de Yudica en el envío"
        resultado: "Se rechaza y la configuración no cambia"
validaciones:
  - "Por cada pantalla se elige un propio publicado, un global publicado o ninguno"
  - "Lo elegido se ve en la pantalla de Tools en la próxima carga"
  - "Elegir 'Ninguno' avisa y la pantalla de Tools queda sin formulario, como hoy"
  - "Los borradores e inactivos no se pueden elegir, tampoco por envío manipulado"
  - "No se puede elegir un formulario de otra empresa"
  - "Procesos, tareas estándar y etapas se muestran solo para leer, con enlace a su ABM"
datos_prueba:
  empresa: "MinTest_SJ con la configuración de formularios de la copia de DEMO"
dudas:
  - "La maqueta dice que Recepción de pañol 'hoy usa la misma clave que salida'. Si es así, cambiar una cambia la otra. Propuesta: confirmar en el código de pañol qué clave lee cada pantalla antes de construir; si comparten clave, se muestran como una sola fila 'Salida y recepción de pañol'."
  - "Para 'Ninguno', ¿se da de baja la fila de configuración o se deja con el número vacío? Propuesta: dar de baja la fila (eliminado), que es lo que hoy deja a la pantalla 'sin formulario'; confirmarlo en la copia de DEMO con las pantallas de almacenes y pañol."
  - "Las claves de pañol (salida, checklist) no las siembra nadie para empresas nuevas (duda 8 del relevamiento). Propuesta: acá se pueden elegir aunque no exista la fila (se crea al guardar); sembrarlas al alta es el cambio del disparador (fuera)."
derivados: {}
notas:
  - "Cubre CP-126. Funciona sin tocar Tools porque las pantallas ya leen esa configuración (T-7 sigue pendiente para R9)."
