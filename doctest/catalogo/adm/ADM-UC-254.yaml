id: ADM-UC-254
modulo: ADM
titulo: Ver qué formulario muestra cada pantalla de Tools
perfil: Administrador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-015-administracion-formularios.md
    detalle: "sección 'Dónde se usan, solo de lectura (CU-74, RF-126 en la parte de mostrar)'"
  - repo: traz-tools
    path: doc/v3/dnato/mockups/empresa-formularios.html
    detalle: "pestaña 'Dónde se usan'"
  - repo: traz-tools
    path: doc/v3/dnato/FORMULARIOS_DINAMICOS_RELEVAMIENTO.md
    detalle: "§3.2 mecanismo A (configuraciones/formulario_<punto> en core.tablas)"
pantallas:
  - "Portal de la empresa → 📝 Formularios → Dónde se usan"
precondiciones:
  - "ana@ es administradora de MinTest_SJ"
  - "En MinTest_SJ, Entrega de materiales usa P-1 (propio), Salida de pañol usa G-1 (global) y Checklist de herramienta no tiene formulario"
  - "MinTest_SJ tiene un proceso y una tarea estándar con formulario elegido en su ABM"
flujo_principal:
  - paso: "En Formularios toca la pestaña 'Dónde se usan'"
    resultado: "Ve 'Qué formulario muestra cada pantalla de Tools en tu empresa.' y una fila por pantalla (Entrega de materiales, Salida de pañol, Recepción de pañol, Checklist de herramienta) con su módulo y el formulario: 'P-1 (propio)', '🌐 G-1 (global)' y 'Ninguno'"
  - paso: "Busca cómo cambiar el formulario de Entrega de materiales"
    resultado: "No hay selector ni 'Guardar': la pestaña es solo para mirar"
  - paso: "Mira la parte 'Elegidos en su propio ABM (solo lectura)'"
    resultado: "Ve el proceso y la tarea estándar con su formulario y 'Ir a Procesos →', 'Ir a Tareas estándar →', sin poder cambiarlos desde acá"
flujos_alternativos:
  - nombre: "Formulario inactivo en uso"
    pasos:
      - paso: "Con P-1 inactivado (ADM-UC-250), vuelve a 'Dónde se usan'"
        resultado: "Entrega de materiales sigue mostrando P-1, marcado '(inactivo)'"
  - nombre: "No se puede cambiar por un envío armado a mano"
    pasos:
      - paso: "Manda, a propósito, un envío para cambiar el formulario de Entrega de materiales"
        resultado: "No hay ninguna dirección que lo reciba: ve 'Esa página no existe.' y la configuración formulario_entrega_materiales de MinTest_SJ está igual que antes"
  - nombre: "Configuración de otra empresa"
    pasos:
      - paso: "Escribe a mano la dirección de 'Dónde se usan' con la empresa de Yudica"
        resultado: "Ve lo de MinTest_SJ (la empresa sale de la sesión), nunca lo de Yudica"
validaciones:
  - "Por cada pantalla se muestra el formulario que tiene hoy la configuración de la empresa (propio, global o 'Ninguno')"
  - "Un formulario inactivo que sigue en uso se muestra marcado '(inactivo)'"
  - "Desde el módulo no se puede cambiar la configuración, tampoco por un envío armado a mano"
  - "Solo se ve la configuración de la empresa de la sesión"
  - "Procesos, tareas estándar y etapas se muestran solo para leer, con enlace a su ABM"
datos_prueba:
  empresa: "MinTest_SJ con la configuración de formularios de la copia de DEMO"
dudas:
  - "La maqueta dice que Recepción de pañol 'hoy usa la misma clave que salida'. Si es así, cambiar una cambia la otra. Propuesta: confirmar en el código de pañol qué clave lee cada pantalla antes de construir; si comparten clave, se muestran como una sola fila 'Salida y recepción de pañol'."
  - "Como la pestaña ya no deja cambiar nada, el administrador no sabe dónde se cambia. Propuesta: debajo de la tabla, el texto 'Para cambiar qué formulario usa una pantalla, hoy se hace en \"Lista de valores\" de Tools.' [SUPUESTO], sin enlace (es una pantalla de Tools que no se toca)."
  - "Si la configuración apunta a un número de formulario que no existe o que no es de la empresa ni global, ¿qué se muestra? Propuesta: 'N.º <número> (no encontrado)' [SUPUESTO], para que el administrador vea el problema sin que el módulo lo arregle."
derivados: {}
notas:
  - "Cubre CP-126 solo en la parte de mostrar. Elegir desde el módulo qué formulario usa cada pantalla queda fuera por la prohibición (decisión de Rodolfo del 2026-11-10: solo vale lo que tiene efecto dentro del módulo; F-6 del REQ)."
