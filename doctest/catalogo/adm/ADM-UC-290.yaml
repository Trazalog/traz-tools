id: ADM-UC-290
modulo: ADM
titulo: Elegir un formulario global para una tarea estándar, una subtarea o una etapa
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-017-administracion-formularios-globales.md
    detalle: "secciones '(vi) Consulta getFormularios' y 'Análisis de impacto en Tools'"
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/data-services/FRMDataService.dbs
    detalle: "consulta getFormularios (línea 6), recurso GET /formularios/{empr_id}"
  - repo: traz-tools
    path: doc/v3/dnato/FORMULARIOS_DINAMICOS_RELEVAMIENTO.md
    detalle: "§8.3, §8.5 y decisiones D1 a D3"
  - repo: traz-tools
    path: doc/v3/dnato/03_CASOS_DE_PRUEBA.md
    detalle: "escenario CP-130 Ámbito (combo de tareas estándar)"
pantallas:
  - "Tools → Tareas estándar → Nueva tarea"
  - "Tools → Tareas estándar → Subtareas"
  - "Tools → Producción → Etapas"
precondiciones:
  - "El planificador trabaja en Empresa Test, que tiene sus formularios P-9 (publicado) y P-10 (en borrador)"
  - "Hay globales G-1 y G-2 publicados, G-3 en borrador y G-4 inactivo"
  - "MinTest_SJ tiene su formulario P-1 publicado"
flujo_principal:
  - paso: "Abre una tarea estándar nueva y despliega 'Formulario Asociado'"
    resultado: "Ve primero P-9 y después 'G-1 (global)' y 'G-2 (global)'"
  - paso: "Elige 'G-1 (global)' y guarda la tarea"
    resultado: "La tarea queda guardada con G-1 como formulario asociado"
  - paso: "Abre las subtareas de esa tarea y despliega 'Formulario Asociado'"
    resultado: "Ve la misma lista: P-9 y después los globales con '(global)'"
  - paso: "Planifica la tarea en Tools"
    resultado: "La tarea planificada dibuja G-1, igual que dibujaría uno propio"
flujos_alternativos:
  - nombre: "Borradores e inactivos"
    pasos:
      - paso: "Busca P-10, G-3 y G-4 en el combo"
        resultado: "No aparecen: solo se ofrecen los publicados"
  - nombre: "Formulario de otra empresa"
    pasos:
      - paso: "Busca P-1 de MinTest_SJ en el combo"
        resultado: "No aparece"
  - nombre: "Etapas"
    pasos:
      - paso: "Abre el alta de una etapa productiva y despliega 'Formulario'"
        resultado: "Ve P-9 y después 'G-1 (global)' y 'G-2 (global)'"
  - nombre: "Empresa sin formularios propios"
    pasos:
      - paso: "En una empresa nueva despliega el combo"
        resultado: "Ve solo los globales publicados, con '(global)'"
validaciones:
  - "Los combos muestran primero los formularios publicados de la empresa y después los globales publicados con '(global)'"
  - "Los formularios en borrador o inactivos no se ofrecen"
  - "Un formulario de otra empresa no se ofrece nunca"
  - "Las tres pantallas (tareas estándar, subtareas, etapas) muestran lo mismo"
  - "Elegir un global funciona igual que elegir uno propio"
datos_prueba:
  formularios: "fixture de formularios de 03_CASOS_DE_PRUEBA.md (P-1, G-1, G-2, G-3) más P-9, P-10 y G-4 inventados, en la copia de DEMO"
dudas:
  - "La verificación §8.5 (formularios sin empresa que hoy existen en producción) no se corrió. Con este cambio, todos se verían en los combos de todas las empresas, aunque alguno sea de un cliente, y la migración que los asignaba (M-7b) no se hace. Propuesta: Rodolfo corre la consulta de solo lectura en producción antes de desplegar; si aparece alguno de un cliente, se le pone a mano su empresa con un script chico aprobado por él, y recién después se despliega."
  - "Una tarea o etapa que ya tiene un formulario que después se inactiva: el combo de edición ya no lo trae y, en etapas, guardar lo deja vacío (Etapa.php:764-765). Propuesta: aceptarlo (hoy no pasa, porque todos los formularios nacen publicados) y que la ventana 'Inactivar' del ABM (REQ-015) avise también cuántas tareas estándar y etapas lo usan."
  - "El perfil de quien arma etapas productivas (Responsable de Producción) no está en el vocabulario de DocTest. Propuesta: el caso usa Planificador y el flujo de etapas se corre con un usuario que tenga el rol de producción; si querés, se propone el perfil nuevo en SCHEMA.md."
  - "Hay una copia vieja del DataService en esb/dataservices/FRMDataService.xml con la misma consulta. Propuesta: no tocarla, porque lo que se despliega es ToolsAPIProject; confirmá que esa carpeta no se despliega en ningún ambiente."
derivados: {}
notas:
  - "Cubre la parte de combos de CP-130 y el punto T-8. Decisiones D2 y D3 del relevamiento."
  - "No cambia las pantallas: solo lo que devuelve la consulta existente, con las mismas claves (form_id, nombre, descripcion)."
