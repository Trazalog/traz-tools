id: ALM-UC-020
modulo: ALM
titulo: Ver el listado de movimientos internos
perfil: Responsable de Almacén
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-comp-almacenes
    path: controllers/Movimientointerno.php
    detalle: "index() dibuja el listado; getMovimientoInternoPaginado() es el server-side de la grilla, con búsqueda y ordenamiento por columna"
  - repo: traz-comp-almacenes
    path: models/Movimientosinternos.php
    detalle: "getMovimientosPaginados() — recibe empr_id y user_id"
  - repo: traz-comp-almacenes
    path: views/movimientosinternos/list.php
pantallas:
  - "Almacenes → Movimientos Internos"
precondiciones:
  - Sesión iniciada en Tools
  - El rol tiene asignado el menú de Almacenes
flujo_principal:
  - paso: "Entra a Almacenes → Movimientos Internos"
    resultado: "Se muestra la grilla con las columnas Fecha y Hora, Establecimiento Origen, Depósito Origen, Establecimiento Destino, Depósito Destino, Remito, Estado y Acciones"
  - paso: "Usa el buscador de la grilla"
    resultado: "La grilla se reduce a los movimientos que coinciden. La búsqueda la resuelve el servidor, no el navegador"
  - paso: "Ordena por una columna"
    resultado: "La grilla se reordena; el orden también lo resuelve el servidor"
flujos_alternativos:
  - nombre: "La empresa todavía no registró movimientos"
    pasos:
      - paso: "Entra a la pantalla"
        resultado: "La grilla aparece vacía"
validaciones:
  - "El listado solo muestra movimientos de la empresa de la sesión"
  - "El estado se muestra como un indicador de color: **En Curso** en verde y **Recibido** en azul. Cualquier otro valor se muestra tal como viene, sin color"
datos_prueba:
  empresa: EMPRESA_TEST_1
  precondicion: "la empresa tiene al menos un movimiento interno registrado"
dudas:
  - "**La grilla se pagina y se busca contra el servidor, y el modelo recibe además del `empr_id` un `user_id`.** ¿Qué significa ese `user_id`: el listado muestra **solo los movimientos que registró ese usuario**, o muestra todos los de la empresa y el usuario se usa para otra cosa (por ejemplo, los depósitos que tiene asignados)? La respuesta cambia lo que el caso tiene que verificar."
  - "¿Esta pantalla **reemplaza** el acceso a Nueva Salida y Nueva Recepción, o convive con los accesos que ya existían? En el controlador las tres cosas cuelgan del mismo lugar (`index()`, `movimientoSalida()`, `movimientoRecepcion()`), pero no puedo determinar desde el código cómo quedó el menú."
notas:
  - "Pantalla **nueva**: entró en `develop` (v2.4.x) mientras `develop-v3` estaba congelada. El controlador `Movimientointerno.php` y la vista `movimientosinternos/list.php` no existían en el punto en que se abrió `develop-v3`."
  - "Relevado contra `de535f68` del submódulo, que es lo que apunta `origin/develop` y lo que corre en el DEMO."
