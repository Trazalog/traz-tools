id: ALM-UC-007
modulo: ALM
titulo: Ver el detalle de un pedido de materiales
perfil: Solicitante
estado: validado
version: "1.0"
origen: baseline
fecha_validacion: 2026-09-07
referencias_codigo:
  - repo: traz-comp-almacenes
    path: controllers/Notapedido.php
    detalle: "getNotaPedidoId() toma id_nota de la query string; getTablaDetalle()"
  - repo: traz-comp-almacenes
    path: models/Notapedidos.php
    detalle: "getNotaPedidoIds($id) — arma el WHERE solo con pema_id, sin empresa"
pantallas:
  - "Almacenes → Pedido Materiales → (ver detalle de una fila)"
precondiciones:
  - Sesión iniciada en Tools
  - Existe un pedido de la empresa
flujo_principal:
  - paso: "En el listado de pedidos abre el detalle de una fila"
    resultado: "Se muestran los artículos pedidos con su cantidad, cuánto se entregó y de qué depósito"
validaciones:
  - "El detalle de un pedido solo debería ser visible para la empresa dueña del pedido"
  - "**Un Solicitante ve solo sus propios pedidos.** Los demás perfiles del almacén ven los de la empresa"
dudas: []
derivados:
  feature: features/alm/ALM-UC-007.ver-el-detalle-de-un-pedido-de-materiales.feature
notas:
  - "**Validado por el PM el 2026-09-07**, que cerró la pregunta que había quedado abierta: *\"el solicitante debería ver solo los propios, sino anotar como bug\"*. Verificado que **hoy no se cumple**: `getNotaPedidoIds($id)` arma el WHERE solo con `pema_id`, y la consulta del listado (`getPedidosXOrigen`) filtra por origen, no por usuario. No hay filtro por solicitante en ninguna capa. Anotado como H-063."
  - "El aislamiento entre empresas quedó **confirmado por el PM** el 2026-08-25: el detalle no debe verse desde otra empresa. Hoy no se cumple y está verificado en vivo (issue #478). Cuando el caso salga de borrador, el test se deriva con `test.fail()` y el issue anotado."
  - "El caso sigue en `borrador` **por pedido explícito del PM** (\"no valides esto ahora\"), no porque falte relevamiento."
