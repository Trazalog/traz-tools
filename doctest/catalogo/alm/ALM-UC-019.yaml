  - "¿En qué se diferencia de Almacenes → Stock (ALM-UC-005)? Las dos muestran existencias con filtros parecidos; ésta agrega la fecha de creación del lote."
  - "¿Quién la usa: el responsable de almacén o el de producción? Del rol depende en qué manual va la ayuda."
