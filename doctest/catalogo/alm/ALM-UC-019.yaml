id: ALM-UC-019
modulo: ALM
titulo: Consultar el stock de producción por lote
perfil: Responsable de Almacén
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-comp-almacenes
    path: controllers/Lote.php
    detalle: "index(), filtrarListado(), Listar_tabla(), getRecipientesPorEstablecimiento()"
