id: MAN-UC-009
modulo: MAN
titulo: Programar una orden de trabajo desde el plan de mantenimiento
perfil: Planificador
estado: validado
version: "2.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: controllers/Calendario.php
    detalle: indexot() muestra el calendario; getcalendarot() trae las órdenes del rango visible; programar() llama al motor
  - repo: traz-tools-man
    path: views/calendar/calendar1.php
    detalle: FullCalendar 5, la caja plegable de filtros y las referencias de color
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsMANAPI.xml
    detalle: "POST /tools/man/plan/programar: el motor — crea las órdenes, copia herramientas e insumos, lanza en Bonita y deshace todo si algo falla (E36, E44)"
pantallas:
  - Mantenimiento → Plan de Mantenimiento
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO) con perfil Planificador
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
  - "Hay trabajo pendiente de programar. Puede venir de cuatro lados: una solicitud aceptada (MAN-UC-008), un preventivo vencido (MAN-UC-014), un pendiente del backlog (MAN-UC-015) o un predictivo disparado (MAN-UC-018)"
produce:
  - Una orden de trabajo en estado `PL` (Planificada), con su mantenedor asignado
depende_de:
  - MAN-UC-008
  - MAN-UC-014
  - MAN-UC-015
  - MAN-UC-018
flujo_principal:
  - paso: Entra a Mantenimiento → Plan de Mantenimiento
    resultado: Se muestra el calendario con las órdenes del rango visible y, arriba, la caja plegable de filtros y las referencias de color (incluye "Correctivo programado")
  - paso: Elige qué va a programar y para cuándo
    resultado: El formulario pide la fecha de programación según el tipo de trabajo; un preventivo o un predictivo se puede programar en serie
  - paso: Confirma con 'Generar Orden'
    resultado: Se crean las órdenes de trabajo, con las herramientas y los insumos copiados del origen, y el origen pasa a planificado
flujos_alternativos:
  - nombre: La orden cae lejos en el futuro
    pasos:
      - paso: Programa un preventivo o un predictivo cuya fecha queda fuera del margen de lanzamiento (7 días si la empresa no configuró otro)
        resultado: La orden queda programada sin lanzar (estado `PL` sin caso de Bonita) y se lanza sola cuando entra en el margen (MAN-UC-040)
  - nombre: Falla Bonita o la base a mitad de camino
    pasos:
      - paso: El motor no puede terminar de crear o lanzar alguna orden
        resultado: "Se muestra el error, la ventana queda abierta y no queda nada a medias: se borran los casos lanzados, las copias y las órdenes, y el plan queda como estaba"
validaciones:
  - "**No se debería poder programar una actividad ya vencida**"
  - La orden hereda las herramientas y los insumos declarados en el trabajo de origen
  - "Las series mensuales, semestrales y anuales se calculan por calendario: el mismo día de cada mes, o el último si el mes no lo tiene (E45)"
  - Un pedido de programación tiene un tope de 400 órdenes y 36 meses (E43)
  - 'Un plan cuyo equipo es de otra empresa no se programa: "no se creó ninguna orden: el equipo no es de la empresa" (E48)'
  - Si la solicitud es urgente, la tarea de Bonita la toma el motor al programar, no la ventana al abrirse (E41)
  - El aviso "Se ha guardado" sale solo cuando se guardó; los errores del servidor se muestran (E40)
dudas: []
derivados:
  test_e2e: tests/e2e/specs/man/MAN-UC-030.ciclo-ot.spec.ts
  ayuda: ayudas/src/man/manual_mantenimiento.html#s06
notas:
  - "Es una de las dos únicas pantallas donde se trabaja **fuera** de la bandeja de tareas: acá y al lanzar una solicitud. Todo lo demás del proceso llega como tarea."
  - Del plan salen las órdenes de los cuatro orígenes. La diferencia con el camino urgente es que ahí planifica el Supervisor desde su propia tarea, no desde esta pantalla.
  - "**Un solo motor para todo**: `POST /tools/man/plan/programar` crea la OT en los cuatro casos (correctivo, preventivo, backlog, predictivo); lo único que cambia es de qué tabla copia las herramientas y los insumos. El correctivo no copia nada: se cargan a mano en la OT."
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
