id: MAN-UC-035
modulo: MAN
titulo: Editar o eliminar un pendiente del backlog
perfil: Supervisor
estado: validado
version: "0.1"
origen: baseline
fecha_validacion: 2026-08-26
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/views/backlog/list.php
    detalle: "las acciones Editar, Eliminar y Ver Archivo de la columna Acciones"
  - repo: traz-prod-assetplanner
    path: application/controllers/Backlog.php
pantallas:
  - "Mantenimiento → Backlog"
precondiciones:
  - Sesión iniciada en AssetPlanner
  - Existe al menos un pendiente del backlog cargado (MAN-UC-015)
flujo_principal:
  - paso: "En el listado elige la acción Editar sobre una fila"
    resultado: "Se abren los datos para modificarlos"
  - paso: "Cambia lo que corresponda y guarda"
    resultado: "Queda actualizado"
flujos_alternativos:
  - nombre: "Eliminar"
    pasos:
      - paso: "Elige la acción Eliminar"
        resultado: "El sistema pide confirmación"
      - paso: "Confirma"
        resultado: "Deja de figurar en el listado"
validaciones:
  - "Editar el pendiente del backlog afecta a las órdenes que se generen **de ahí en adelante**: las ya creadas conservan lo que se les copió"
  - "El listado ofrece Editar, Eliminar y Ver Archivo sobre cada fila"
dudas: []
derivados:
  ayuda: ayudas/src/man/manual_mantenimiento.html#s09
notas:
  - "**Por qué editar no toca las órdenes en curso:** al programar una orden, las herramientas y los insumos se **copian** del plan a la orden. Desde ese momento la orden tiene su propia lista, independiente. Es lo que permite corregir un plan sin alterar trabajo que ya está en la calle."
