id: MAN-UC-019
modulo: MAN
titulo: Trabajar desde la bandeja de tareas
perfil: Mantenedor
estado: validado
version: "2.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-comp-bpm
    path: controllers/Proceso2.php
    detalle: "Mis Tareas, la bandeja de tools: lista las tareas de todos los procesos de la empresa"
  - repo: traz-tools-man
    path: views/tareas/panel.php
    detalle: el panel de Mantenimiento que la bandeja de tools abre para las tareas de este proceso
  - repo: traz-tools-man
    path: controllers/Tarea.php
    detalle: Mantenimiento → Bandeja de Tareas, la bandeja propia del módulo
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsMANAPI.xml
    detalle: POST /tools/man/bandeja/pagina y /bandeja/tarea/detalle (E30, E32)
pantallas:
  - Mis Tareas (bandeja de tools, panel de Mantenimiento)
  - Mantenimiento → Bandeja de Tareas
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO)
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
depende_de:
  - MAN-UC-007
flujo_principal:
  - paso: Entra a Mis Tareas
    resultado: Se listan como tarjetas las tareas pendientes de todos los procesos de la empresa, entre ellas las de Mantenimiento
  - paso: Abre una tarea de Mantenimiento
    resultado: "Se abre el panel de Mantenimiento: la cabecera de la solicitud y la orden en paneles plegables y, abajo, el formulario del paso (analizar, asignar, ejecutar, informe, verificar, conformidad)"
  - paso: Resuelve la tarea
    resultado: La tarea se cierra y el proceso le pasa la siguiente a quien corresponda
flujos_alternativos:
  - nombre: Bandeja propia de Mantenimiento
    pasos:
      - paso: Entra a Mantenimiento → Bandeja de Tareas
        resultado: Se listan solo las tareas de Mantenimiento, con tipo, estado, asignado, fecha, equipo, sector, cliente y los números de solicitud, orden y pedido
validaciones:
  - "Es la bandeja de entrada del proceso: refleja las tareas de Bonita del usuario"
  - Solo muestra tareas de casos de la empresa de la sesión
  - Cada tarea corresponde a un paso del circuito que le toca a este usuario
  - Las pestañas Comentarios y Trazabilidad las pone la bandeja de tools; las demás pestañas del paso se ven todas
dudas: []
derivados:
  test_e2e: tests/e2e/specs/man/MAN-UC-012-020.informes-reportes.spec.ts
  ayuda: ayudas/src/man/manual_mantenimiento.html#s01
notas:
  - "**Es el lugar de trabajo del día a día.** Salvo lanzar una solicitud y planificar en el calendario, todo el resto del proceso llega acá: analizar una solicitud, editar un backlog, asignar un responsable, ejecutar una orden, confeccionar el informe, verificarlo y prestar conformidad. El detalle de qué tarea le toca a cada rol está en `doc/man/proceso-mantenimiento.md`."
  - "Por eso, para alguien que arranca, **conviene enseñar esta pantalla antes que el menú**: el trabajo viene solo."
  - "Es la bandeja del proceso: lo que el circuito le pone a cada uno para hacer. Para alguien que arranca, **puede ser el mejor punto de entrada diario** — en vez de recorrer pantallas, mirar qué le tocó."
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
