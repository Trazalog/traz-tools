id: MAN-UC-005
modulo: MAN
titulo: Dar de alta un componente
perfil: Supervisor
estado: validado
version: "0.1"
origen: baseline
fecha_validacion: 2026-08-26
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/controllers/Componente.php
    detalle: "agregar_componente() crea el componente; codifNombre($ultimoId,$empId) arma su código"
  - repo: traz-prod-assetplanner
    path: application/models/Componentes.php
pantallas:
  - "Mantenimiento → Componentes → Nuevo"
precondiciones:
  - Sesión iniciada en AssetPlanner
flujo_principal:
  - paso: "Abre el alta de componentes"
    resultado: "Se muestra el formulario"
  - paso: "Carga los datos del componente y su marca"
    resultado: "El formulario acepta los datos"
  - paso: "Guarda"
    resultado: "El componente queda dado de alta y disponible para asignarlo a un equipo"
validaciones:
  - "El **código trazable lo escribe el usuario**: no se genera solo"
  - "Un componente es una **pieza intercambiable del equipo**"
  - "El código del componente lo arma el sistema a partir del último id y de la empresa"
dudas: []
derivados:
  ayuda: ayudas/src/man/manual_mantenimiento.html#s03
notas:
  - "Un componente es una **pieza intercambiable del equipo** (PM, 2026-08-26)."
  - "**Corrección de la primera pasada:** se había supuesto que `codifNombre()` armaba el código del componente. No es así — esa función arma el nombre de un archivo adjunto, con id, empresa y fecha. El código del componente viene del formulario."
