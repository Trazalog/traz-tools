id: MAN-UC-026
modulo: MAN
titulo: Asignar una meta a un equipo
perfil: Supervisor
estado: validado
version: "1.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: controllers/Equipo.php
    detalle: getMeta(), asignarMeta()
  - repo: traz-tools-man
    path: views/Equipo/list.php
    detalle: el modal 'Asignar Meta' — un número entre 1 y 100, con opción de borrarla
pantallas:
  - Mantenimiento → Equipos → Asignar Meta
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO)
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
depende_de:
  - MAN-UC-002
flujo_principal:
  - paso: En el listado de equipos elige la acción Asignar Meta
    resultado: Se abre el formulario con la meta actual, si tiene
  - paso: Carga un valor entre 1 y 100
    resultado: La meta queda asignada al equipo
flujos_alternativos:
  - nombre: Quitar la meta
    pasos:
      - paso: Usa la opción 'Borrar Meta'
        resultado: El equipo queda sin meta
validaciones:
  - Es la **meta de disponibilidad** del equipo, en porcentaje
  - "La meta es **opcional**: un equipo puede no tener ninguna"
  - El valor va de 1 a 100
dudas: []
derivados:
  test_e2e: tests/e2e/specs/man/MAN-UC-003-004-022-026-028.equipos.spec.ts
  ayuda: ayudas/src/man/manual_mantenimiento.html#s10
notas:
  - "**Qué es la meta, relevado del código:** la columna se llama `meta_disponibilidad` y la usa `kpiCalcularDisponibilidad()`. Es el porcentaje de tiempo que uno se propone que el equipo esté disponible, y el reporte Rep Equipo compara contra ella la disponibilidad real."
  - "**Buena práctica:** conviene ponerle meta a los equipos críticos, no a todos. Una meta sin sentido —95% en un equipo que se usa dos veces al año— solo agrega ruido al panel."
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
