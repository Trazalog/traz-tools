  - ABM de Mantenimiento → Sistemas
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO) con perfil Supervisor
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
produce:
  - Las listas que usan los formularios de equipos, planes y órdenes
flujo_principal:
  - paso: Entra a un catálogo del menú ABM de Mantenimiento
    resultado: Se lista lo cargado en la empresa
  - paso: Agrega un valor nuevo
    resultado: Aparece en el listado y en los desplegables que lo usan
  - paso: Edita un valor
    resultado: Queda actualizado
  - paso: Elimina un valor
    resultado: Deja de figurar en el listado
validaciones:
  - Cada catálogo muestra y modifica solo los valores de la empresa de la sesión
  - "Unidad de medida no está: se administra en Almacenes de tools (E57)"
dudas: []
derivados:
