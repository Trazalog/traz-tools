pantallas:
  - ABM de Mantenimiento → Área
  - ABM de Mantenimiento → Procesos
  - ABM de Mantenimiento → Grupo
  - ABM de Mantenimiento → Sector
  - ABM de Mantenimiento → Contratista
  - ABM de Mantenimiento → Tareas estándar
