id: MAN-UC-027
modulo: MAN
titulo: Adjuntar documentación a un equipo
perfil: Supervisor
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools-man
    path: views/Equipo/list.php
    detalle: las acciones Agregar, Editar y Eliminar Adjunto
  - repo: traz-tools-man
    path: controllers/Equipo.php
    detalle: agregarAdjunto(), EditarAdjunto(), eliminaAdjunto()
pantallas:
  - Mantenimiento → Equipos → Agregar Adjunto
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO)
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
depende_de:
  - MAN-UC-002
flujo_principal:
  - paso: En el listado de equipos elige Agregar Adjunto
    resultado: Se abre el formulario para subir el archivo
  - paso: Elige el archivo y confirma
    resultado: El archivo queda asociado al equipo y se puede abrir desde el listado
flujos_alternativos:
  - nombre: Reemplazar o quitar un adjunto
    pasos:
      - paso: Usa Editar Adjunto para cambiarlo, o Eliminar Adjunto para sacarlo
        resultado: El adjunto queda actualizado o eliminado
validaciones:
  - Un equipo puede tener varios adjuntos, y cada uno se puede reemplazar o quitar
  - El adjunto queda asociado al equipo
dudas:
  - "**Falta confirmar qué tipos de archivo se aceptan y de qué tamaño máximo.** No se encontró la configuración de la subida, y es lo primero con lo que alguien choca: el manual de un equipo suele ser un PDF pesado."
notas:
  - "El nombre del archivo lo arma el sistema con `codifNombre()`: id del equipo, empresa y fecha y hora. Así dos adjuntos nunca se pisan."
  - "**Para qué conviene usarlo:** el manual del fabricante, los planos, el certificado de garantía y las fotos del equipo instalado. Es la documentación que alguien va a necesitar en el momento de intervenirlo."
  - Los adjuntos también existen en Backlog y Predictivo, con las mismas tres acciones. Si el comportamiento es idéntico, se documenta una sola vez.
  - MAN guarda y lee los adjuntos en la misma carpeta que asset (E11), así que los adjuntos cargados en asset se siguen viendo.
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
