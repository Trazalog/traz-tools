id: MAN-UC-033
modulo: MAN
titulo: Editar o eliminar un plan preventivo
perfil: Planificador
estado: validado
version: "1.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: views/preventivo/list.php
    detalle: las acciones Editar, Eliminar y Ver Archivo
  - repo: traz-tools-man
    path: controllers/Preventivo.php
    detalle: editar_preventivo(), baja_preventivo()
pantallas:
  - Mantenimiento → Preventivo
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO)
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
  - Existe al menos un plan preventivo cargado (MAN-UC-014)
depende_de:
  - MAN-UC-014
flujo_principal:
  - paso: En el listado elige la acción Editar sobre una fila
    resultado: Se abren los datos para modificarlos
  - paso: Cambia lo que corresponda y guarda
    resultado: Queda actualizado
flujos_alternativos:
  - nombre: Eliminar
    pasos:
      - paso: Elige la acción Eliminar
        resultado: El sistema pide confirmación
      - paso: Confirma
        resultado: Deja de figurar en el listado
validaciones:
  - "Editar el plan preventivo afecta a las órdenes que se generen **de ahí en adelante**: las ya creadas conservan lo que se les copió"
  - El listado ofrece Editar, Eliminar y Ver Archivo sobre cada fila
dudas: []
derivados:
  ayuda: ayudas/src/man/manual_mantenimiento.html#s09
notas:
  - "**Por qué editar no toca las órdenes en curso:** al programar una orden, las herramientas y los insumos se **copian** del plan a la orden. Desde ese momento la orden tiene su propia lista, independiente. Es lo que permite corregir un plan sin alterar trabajo que ya está en la calle."
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
