notas:
  - "**Período y frecuencia, en buena práctica de mantenimiento:** el *período* es la unidad con la que se cuenta —días, semanas, meses— y la *frecuencia*, cada cuántas de esas unidades se repite. \"Período: mes, frecuencia: 3\" es cada tres meses. La **fecha base** es desde cuándo se empieza a contar el primer vencimiento."
  - "**Por qué existe el preventivo:** la idea es intervenir el equipo antes de que falle, en un momento elegido por uno y no por la máquina. Cuesta menos que reparar una rotura —no hay parada imprevista, no hay daños secundarios, el repuesto está disponible— y por eso la práctica habitual es que la mayor parte del trabajo de un taller sea planificado y no correctivo."
  - "**Cómo elegir la frecuencia:** el punto de partida es lo que dice el fabricante en el manual del equipo. Después se ajusta con la experiencia: si el equipo se rompe entre dos preventivos, la frecuencia es muy larga; si al intervenirlo nunca hay nada para hacer, es muy corta."
  - "**Las herramientas e insumos que se cargan acá quedan declarados, no pedidos.** Se copian a cada orden que se genere, y el pedido al almacén recién nace al ejecutar esa orden."
  - "El manual de ayuda existente `manual_mantenimeinto_preventivo.html` tiene el flujo completo en siete secciones —creación, período y frecuencia, duración y recursos, herramientas e insumos, planificación—, así que es una fuente de intención sólida para este caso."
