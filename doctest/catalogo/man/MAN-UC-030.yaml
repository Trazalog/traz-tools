id: MAN-UC-030
modulo: MAN
titulo: El ciclo de vida de una orden de trabajo
perfil: Planificador
estado: validado
version: "1.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: models/Otrabajos.php
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsMANAPI.xml
    detalle: POST /tools/man/plan/programar la crea en PL; /plan/lanzar le abre el caso; /plan/anular la anula (E36, E58–E60)
pantallas:
  - Mantenimiento → Ordenes de Trabajo
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO)
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
depende_de:
  - MAN-UC-009
flujo_principal:
  - paso: Se programa desde el plan de mantenimiento (MAN-UC-009), venga de una solicitud, un preventivo, un predictivo o un backlog
    resultado: La orden nace planificada (`PL`), con las herramientas y los insumos copiados de su origen. Si es un preventivo o un predictivo lejano, nace sin lanzar y se lanza al entrar en el margen (MAN-UC-040)
  - paso: Se asigna a un responsable con su pedido de materiales (MAN-UC-011)
    resultado: La orden queda asignada (`AS`) y el pedido va al almacén de tools
  - paso: El mantenedor la ejecuta desde su bandeja
    resultado: La orden queda en curso (`C`)
  - paso: Se carga el informe de servicio (MAN-UC-012)
    resultado: La orden queda terminada (`T`)
  - paso: El supervisor verifica y el solicitante presta conformidad (MAN-UC-013)
    resultado: La orden pasa a `CE` y después a `CN`
flujos_alternativos:
  - nombre: Anular una orden sin lanzar
    pasos:
      - paso: Se anula desde el listado o el calendario (MAN-UC-041)
        resultado: La orden queda `AN` y deja de verse en el listado y en el calendario
validaciones:
  - Una orden se puede cerrar **parcial** (`TE`) o **total** desde el listado
  - La orden pasa por `PL` → `AS` → `C` → `T` → `CE` → `CN`; las sin lanzar se pueden anular (`AN`)
  - La columna Origen dice de cuál de los cuatro caminos vino la orden
  - Los filtros del listado permiten ver las órdenes por estado y por período programado
dudas: []
derivados:
  test_e2e: tests/e2e/specs/man/MAN-UC-030.ciclo-ot.spec.ts
  ayuda: ayudas/src/man/manual_mantenimiento.html#s07
notas:
  - "Los cuatro orígenes —solicitud urgente, backlog, preventivo y predictivo— desembocan en el mismo tipo de orden y siguen desde ahí el mismo recorrido. La diferencia está en **quién asigna el responsable**: en el camino urgente lo hace el Supervisor; en el resto, el Planificador."
  - Cuatro caminos distintos —correctivo, preventivo, predictivo y backlog— desembocan en el mismo tipo de orden y siguen desde ahí el mismo recorrido. Entender eso es entender el módulo.
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
