id: MAN-UC-021
modulo: MAN
titulo: Administrar el envío de órdenes
perfil: Planificador
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/controllers/Envio.php
  - repo: traz-prod-assetplanner
    path: application/models/Administraciones.php
pantallas:
  - "Mantenimiento → Administrar Ordenes"
precondiciones:
  - Sesión iniciada en AssetPlanner
flujo_principal:
  - paso: "Entra a Mantenimiento → Administrar Ordenes"
    resultado: "Se lista con ID, Número, Fecha Inicio, Fecha Entrega, Fecha Terminada, Fecha Aviso, Detalle y Estado"
dudas:
  - "**No se pudo determinar para qué sirve esta pantalla.** El listado estaba vacío en el DEMO y el nombre no lo aclara: tiene una *Fecha de Entrega* y una *Fecha de Aviso* que no aparecen en el listado normal de órdenes de trabajo. ¿Es para órdenes que se mandan a un tercero —un contratista, un service externo—? Se relaciona con el `ABM Contratista` y con la tabla de *Contratistas Asignados* que aparece en el listado de equipos."
  - "¿Quién la usa y en qué momento del circuito?"
  - "Si es funcionalidad que quedó sin uso, conviene saberlo y no documentarla."
notas:
  - "Es la única pantalla del menú de Mantenimiento que no se pudo interpretar ni desde el código ni desde los manuales existentes."
