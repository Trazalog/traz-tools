id: MAN-UC-012
modulo: MAN
titulo: Cargar el informe de servicio
perfil: Mantenedor
estado: validado
version: "2.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: controllers/Tarea.php
    detalle: la tarea "Confecciona informe de servicio" de la bandeja
  - repo: traz-tools-man
    path: views/tareas/view_inf_servicio_modal.php
    detalle: pestañas Lecturas, Tareas, Recursos Humanos, Herramientas e Insumos y Evidencias
  - repo: traz-tools-man
    path: views/ot/materiales.php
    detalle: la pestaña Herramientas e Insumos
  - repo: traz-tools-man
    path: controllers/Ordenservicio.php
    detalle: getInsumosPorOT(), getEntregasPorOT(), getHerramientasUsadas(), buscarVales(), asociarVale(), quitarVale(), tildarHerramienta()
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsMANAPI.xml
    detalle: "POST /tools/man/bandeja/tarea/informe: borra el informe anterior y escribe el nuevo en una operación; primero la base, después Bonita (E33)"
pantallas:
  - Mis Tareas → Confecciona informe de servicio
  - Mantenimiento → Bandeja de Tareas → Confecciona informe de servicio
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO) con perfil Mantenedor
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
  - La orden de trabajo se ejecutó y la tarea "Confecciona informe de servicio" está en su bandeja
produce:
  - El informe de servicio de la orden, que la deja Terminada (`T`)
depende_de:
  - MAN-UC-011
flujo_principal:
  - paso: Abre la tarea "Confecciona informe de servicio" desde su bandeja
    resultado: Se abre el informe con las pestañas Lecturas, Tareas, Recursos Humanos, Herramientas e Insumos y Evidencias
  - paso: Registra la lectura de cierre del equipo, las tareas realizadas y quiénes trabajaron
    resultado: Quedan cargadas las tareas y los operarios
  - paso: En Herramientas e Insumos revisa el pedido y las entregas, y asocia los vales del pañol que usó en esta orden (MAN-UC-039)
    resultado: Las herramientas de esos vales quedan como usadas en la orden
  - paso: Adjunta evidencias si las tiene y confirma
    resultado: El informe queda guardado, la orden pasa a Terminada (`T`) y la tarea de verificación le llega al Supervisor
flujos_alternativos:
  - nombre: El Supervisor rechazó el informe
    pasos:
      - paso: Abre la tarea "Edición Informe de Servicios"
        resultado: Se abre el informe cargado, con las mismas pestañas, para corregirlo; al guardar vuelve a verificación. Las evidencias se conservan
validaciones:
  - "Insumos: lo pedido = lo entregado + lo pendiente; las entregas parciales se ven una por una"
  - "**Desde el informe nunca se genera un vale**: los vales los hace siempre el pañolero; el mantenedor solo indica cuáles de sus vales son de esta orden (regla del PM, 2026-11-03)"
  - Si la base falla no se cierra la tarea; si falla Bonita, el informe queda guardado y al reintentar se reemplaza completo (E33)
  - El informe queda asociado a la orden de trabajo
dudas: []
notas:
  - "Sale de borrador: las secciones del informe se relevaron de la vista de MAN (`view_inf_servicio_modal.php`) y el guardado del recurso `bandeja/tarea/informe` (E33)."
  - Si el equipo no trae lectura, la consola muestra un error al abrir el informe; no impide guardar (H40).
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
