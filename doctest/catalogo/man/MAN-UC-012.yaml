id: MAN-UC-012
modulo: MAN
titulo: Cargar el informe de servicio
perfil: Mantenedor
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/controllers/Ordenservicio.php
    detalle: "setOrdenServ() guarda el informe; getInsumosPorOT() trae los insumos"
  - repo: traz-prod-assetplanner
    path: application/models/Ordenservicios.php
    detalle: "setOrdenServicios() escribe orden_servicio, deta_ordenservicio, asignausuario y el vale de salida de herramientas"
pantallas:
  - "Mantenimiento → Informe de Servicios"
precondiciones:
  - Sesión iniciada en AssetPlanner
  - La orden de trabajo se ejecutó
flujo_principal:
  - paso: "Entra a Mantenimiento → Informe de Servicios"
    resultado: "Se muestra el listado con Nº Informe, Nº OT, Descripción, Tarea, Equipo, fechas y recursos humanos"
  - paso: "Carga el informe de la orden que ejecutó"
    resultado: "Se abre el formulario con las secciones del informe"
  - paso: "Registra qué se hizo, quiénes trabajaron y cuánto tiempo llevó"
    resultado: "Quedan registradas las tareas realizadas y los operarios"
  - paso: "Confirma"
    resultado: "El informe queda cargado y a la espera de verificación"
validaciones:
  - "Si el Supervisor rechaza el informe, **vuelve al Mantenedor para corregirlo** y presentarlo de nuevo"
  - "El informe queda asociado a la orden de trabajo"
dudas:
  - "**Cuáles son las secciones del informe y qué se exige en cada una hay que relevarlo del código del guardado**, no del HTML ni de la base. El manual de ayuda existente habla de *cinco solapas*: falta contrastarlo con `Ordenservicio::setOrdenServ()` y ver qué valida antes de guardar."
notas:
  - "**Lo que el informe muestra como \"Insumos Usados\" es en realidad lo PEDIDO**, no lo entregado ni lo consumido. Se documenta así, tal como está. **Mejora anotada (PM, 2026-08-26): en próximas versiones va a mostrar lo entregado, cuando se complete la integración con el Almacenes de Tools —que está en curso.**"
  - "El informe registra además un vale de salida con las herramientas usadas, pero es referencial: no mueve stock de pañol ni registra devolución."
