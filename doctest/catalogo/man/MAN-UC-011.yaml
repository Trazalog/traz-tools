id: MAN-UC-011
modulo: MAN
titulo: Ejecutar una orden de trabajo y pedir los materiales
perfil: Mantenedor
estado: validado
version: "1.0"
origen: baseline
fecha_validacion: 2026-08-26
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/controllers/Otrabajo.php
    detalle: "verEjecutarOT() abre el modal y crea el pedido; EjecutarOT() lanza el proceso"
  - repo: traz-prod-assetplanner
    path: application/controllers/Ordeninsumo.php
    detalle: "el pedido de materiales de la orden"
pantallas:
  - "Mantenimiento → Ordenes de trabajo → Ejecutar"
precondiciones:
  - Sesión iniciada en AssetPlanner
  - Existe una orden de trabajo programada
flujo_principal:
  - paso: "Abre la orden de trabajo y elige ejecutarla"
    resultado: "Se muestra qué hay que hacer, con las herramientas y los insumos que se declararon"
  - paso: "Revisa los materiales que hacen falta y agrega los que falten"
    resultado: "El pedido de materiales queda armado"
  - paso: "Confirma la ejecución"
    resultado: "El pedido se manda al almacén para que lo aprueben y lo entreguen"
validaciones:
  - "El pedido se crea, y desde ahí lo toma el almacenero: **aprueba o rechaza, y después entrega**"
  - "El pedido de materiales se arma con los insumos declarados en la orden"
dudas: []

derivados:
  ayuda: ayudas/src/man/manual_mantenimiento.html#s07
notas:
  - "Es **el mismo proceso de Bonita que el pedido de materiales de Almacenes en Tools**: se crea el pedido, el almacenero lo aprueba o lo rechaza, y al entregar descuenta el stock. El circuito completo está en el manual de Almacenes."
  - "**Las herramientas hoy solo se listan** —no se piden ni se entregan—. En v3 eso va a cambiar: se van a asociar a las herramientas de Tools. Por ahora la ayuda explica lo que hay."
  - "Es el punto donde Mantenimiento se engancha con Almacenes. Del otro lado, el pedido sigue el circuito que documenta el manual de Almacenes: aprobación y entrega, que es lo único que descuenta stock."
