id: MAN-UC-003
modulo: MAN
titulo: Editar un equipo
perfil: Supervisor
estado: validado
version: "2.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: controllers/Equipo.php
    detalle: getEditar() trae los datos del equipo; editar_equipo() guarda los cambios
  - repo: traz-tools-man
    path: models/Equipos.php
    detalle: solo modifica equipos de la empresa de la sesión (E4)
pantallas:
  - Mantenimiento → Equipos → (editar una fila)
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO)
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
  - Existe al menos un equipo en la empresa
depende_de:
  - MAN-UC-002
flujo_principal:
  - paso: En el listado abre un equipo para editarlo
    resultado: Se muestra el formulario con los datos cargados
  - paso: Modifica lo que corresponda y guarda
    resultado: El equipo queda actualizado
validaciones:
  - "Solo se puede editar un equipo de la empresa de la sesión: ante uno de otra empresa no se modifica nada (E4)"
dudas: []
derivados:
  ayuda: ayudas/src/man/manual_mantenimiento.html#s02
notas:
  - "**Mejora a analizar (PM, 2026-08-26):** permitir que un Administrador sí pueda cambiar el código, para corregir una carga mal hecha. Hoy la pantalla lo deja editar a cualquiera, que es lo contrario de lo que se busca — queda anotado en el registro de hallazgos."
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
