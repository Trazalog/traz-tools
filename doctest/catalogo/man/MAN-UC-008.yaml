id: MAN-UC-008
modulo: MAN
titulo: Analizar una solicitud y decidir qué hacer
perfil: Supervisor
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/controllers/Sservicio.php
  - repo: traz-prod-assetplanner
    path: application/controllers/Tarea.php
    detalle: "las tareas del proceso de Bonita que mueven la solicitud"
pantallas:
  - "Mantenimiento → Solicitud de Servicio"
  - "Mis Tareas"
precondiciones:
  - Sesión iniciada en AssetPlanner
  - Existe una solicitud pendiente de análisis
flujo_principal:
  - paso: "Abre la solicitud pendiente, desde el listado o desde Mis Tareas"
    resultado: "Se muestra qué equipo es, qué reportó el solicitante y los archivos que adjuntó"
  - paso: "Decide si la solicitud procede"
    resultado: "La solicitud avanza a planificación o se rechaza"
validaciones:
  - "Una solicitud rechazada no genera orden de trabajo"
dudas:
  - "**¿Quién puede aceptar o rechazar una solicitud, y qué pasa cuando se rechaza?** ¿Se le avisa al solicitante? ¿Puede volver a pedirlo?"
  - "El análisis parece pasar por una tarea de Bonita que aparece en *Mis Tareas*. ¿El supervisor trabaja siempre desde ahí, o también desde el listado de solicitudes?"
notas:
  - "El manual de ayuda existente le dedica una sección propia (s06, *Analizar la Solicitud*)."
