id: MAN-UC-007
modulo: MAN
titulo: Pedir un servicio cuando algo falla
perfil: Solicitante
estado: validado
version: "2.0"
origen: baseline
fecha_validacion: 2026-11-03
referencias_codigo:
  - repo: traz-tools-man
    path: controllers/Sservicio.php
    detalle: index() lista; nuevaSS() crea la solicitud; eliminar_solicitud() la anula con su caso
  - repo: traz-tools-man
    path: models/Sservicios.php
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsMANAPI.xml
    detalle: 'POST /tools/man/solicitud: alta, caso del "Proceso de Mantenimiento AssetPlanner" en Bonita y case_id; si algo falla borra el caso y la solicitud (E22)'
pantallas:
  - Mantenimiento → Solicitud de Servicio
precondiciones:
  - Sesión iniciada en Tools (ingreso de DNATO) con perfil Solicitante
  - La empresa está vinculada con Mantenimiento (`core.empresas.empr_id_mysql`); sin eso las pantallas avisan "La empresa no está vinculada con Mantenimiento"
  - El equipo que falla está dado de alta (MAN-UC-002). **Una empresa recién creada no tiene ninguno**
produce:
  - Una solicitud de servicio en estado `S` (Solicitada), y el proceso de mantenimiento lanzado en Bonita
depende_de:
  - MAN-UC-002
flujo_principal:
  - paso: Entra a Mantenimiento → Solicitud de Servicio
    resultado: Se muestra el listado con Nro, Nro de OT, Fecha, Fecha Fin, tiempos de ciclo, asignación y generación, Solicitante, Equipo y Sector
  - paso: Crea una solicitud nueva
    resultado: Se abre el formulario
  - paso: Elige el equipo que tiene el problema y describe qué pasa
    resultado: Quedan registrados el equipo y la descripción de la falla
  - paso: Adjunta fotos o documentos si los tiene
    resultado: Los archivos quedan asociados a la solicitud
  - paso: Confirma
    resultado: La solicitud queda registrada y a la espera de que alguien la analice
validaciones:
  - Puede pedir un servicio cualquier usuario con el rol *Solicitante de Mantenimiento* en Bonita
  - La solicitud queda asociada al equipo y al solicitante
  - "La solicitud y su caso de Bonita se crean en una sola operación: si Bonita falla, no queda una solicitud sin caso (E22)"
  - Solo se puede pedir un servicio sobre un equipo de la empresa de la sesión
dudas: []
derivados:
  test_e2e: tests/e2e/specs/man/MAN-UC-007.solicitud-servicio.spec.ts
  ayuda: ayudas/src/man/manual_mantenimiento.html#s05
notas:
  - "**El proceso arranca acá.** La solicitud entra al proceso de mantenimiento por la puerta *Solicitud de Servicio*, y lo primero que le va a pasar es el análisis del Supervisor (MAN-UC-008). El recorrido completo está en `doc/man/proceso-mantenimiento.md`."
  - "Las tres columnas de tiempo del listado —ciclo, asignación y generación— miden ese recorrido: cuánto tardó en atenderse, en asignarse y en generarse la orden."
  - "Es el arranque del **circuito correctivo**: algo se rompe, alguien lo reporta. El manual de ayuda existente `manual_mantenimiento_correrctivo.html` tiene una sección dedicada (s05) con el flujo validado."
  - Rearmado para MAN en tools (migración de asset, 2026-11-03). Validación del PM pendiente en el PR.
