id: MAN-UC-029
modulo: MAN
titulo: El ciclo de vida de una solicitud de servicio
perfil: Solicitante
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/models/Sservicios.php
    detalle: "los códigos de estado que aparecen: AC, AN, ASC, C, CN, EL, GET, S, T"
  - repo: traz-prod-assetplanner
    path: application/controllers/Tarea.php
    detalle: "las tareas de Bonita que mueven la solicitud entre estados"
pantallas:
  - "Mantenimiento → Solicitud de Servicio"
  - "Mis Tareas"
precondiciones:
  - Sesión iniciada en AssetPlanner
flujo_principal:
  - paso: "Alguien reporta una falla y crea la solicitud (MAN-UC-007), o la reporta al cargar una lectura (MAN-UC-024)"
    resultado: "La solicitud queda registrada y esperando análisis"
  - paso: "El supervisor la analiza y decide (MAN-UC-008)"
    resultado: "La solicitud se acepta y pasa a planificación, o se rechaza"
  - paso: "Se le programa una orden de trabajo (MAN-UC-009)"
    resultado: "La solicitud queda vinculada a esa orden — el listado muestra el Nº de OT"
  - paso: "La orden se ejecuta, se informa y se verifica"
    resultado: "Cuando el solicitante presta conformidad, la solicitud queda cerrada"
validaciones:
  - "El listado muestra el Nº de OT de la solicitud una vez programada"
  - "Los tiempos de ciclo, asignación y generación se miden sobre este recorrido"
dudas:
  - "**Hay que confirmar el catálogo de estados y qué nombre lleva cada uno en pantalla.** En el código del modelo aparecen los códigos `AC`, `AN`, `ASC`, `C`, `CN`, `EL`, `GET`, `S` y `T`; en pantalla se ven nombres como *Solicitada*, *Planificada*, *Terminada* y *Conforme*. **No se puede deducir con seguridad cuál corresponde a cuál** — no quise inventar la traducción."
  - "**¿Qué mide cada una de las tres columnas de tiempo del listado?** T. de ciclo, T. Asignación y T. Generación. Son los indicadores de servicio y dependen de estas transiciones."
  - "¿Qué pasa con una solicitud rechazada: queda registrada, se le avisa a quien la pidió, se puede reabrir?"
notas:
  - "Es el recorrido del **circuito correctivo** completo. Cada paso tiene su caso propio; éste los hilvana y es el que hay que leer primero para entender el módulo."
