id: MAN-UC-004
modulo: MAN
titulo: Eliminar un equipo
perfil: Supervisor
estado: validado
version: "1.0"
origen: baseline
fecha_validacion: 2026-08-26
referencias_codigo:
  - repo: traz-prod-assetplanner
    path: application/controllers/Equipo.php
    detalle: "baja_equipo()"
  - repo: traz-prod-assetplanner
    path: application/models/Equipos.php
pantallas:
  - "Mantenimiento → Equipos → Eliminar"
precondiciones:
  - Sesión iniciada en AssetPlanner
  - Existe un equipo activo
flujo_principal:
  - paso: "En la columna Acciones del listado elige Eliminar"
    resultado: "El sistema pide confirmación"
  - paso: "Confirma"
    resultado: "El equipo deja de figurar en el listado"
dudas: []
derivados:
  ayuda: ayudas/src/man/manual_mantenimiento.html#s02
notas:
  - "**Verificado en el código:** eliminar e inhabilitar son acciones distintas y dejan estados distintos — `AN` la primera, `IN` la segunda. Ninguna borra el registro, así que el historial del equipo se conserva en los dos casos."
  - "Es la misma decisión que en DNATO y en ALM: nunca borrado físico, porque rompe la trazabilidad de lo que se hizo. Un equipo acumula órdenes de trabajo, lecturas e informes."
  - "**Eliminar e inhabilitar son cosas distintas:** inhabilitar (MAN-UC-022) es reversible y para equipos que salen de servicio un tiempo; eliminar es para el que nunca se usó."
