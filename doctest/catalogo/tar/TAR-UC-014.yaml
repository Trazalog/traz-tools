id: TAR-UC-014
modulo: TAR
titulo: Eliminar una tarea planificada
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-tareasestandar
    path: views/tareas/planificacion_tareas.php
    detalle: eliminarTarea()
  - repo: traz-comp-tareasestandar
    path: controllers/Tarea.php
    detalle: eliminarPlanificada()
pantallas:
  - Planificación de Trabajos → hito → 🗑 en la tarea
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Una tarea en un hito
depende_de:
  - TAR-UC-009
flujo_principal:
  - paso: Pulsa 🗑 en la tarea y confirma
    resultado: La tarea desaparece de la lista y del calendario; si tenía caso, el caso se borra y sale de la bandeja del responsable
  - paso: Elimina la última tarea del hito
    resultado: Vuelve a verse "No hay Tareas Planificadas"
flujos_alternativos:
  - nombre: Tarea sin id
    pasos:
      - paso: Elimina una tarea que no terminó de guardarse
        resultado: Ve "La tarea seleccionada no posee ID"
validaciones:
  - Solo se pueden eliminar tareas de la propia empresa
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - "D-17: ¿se puede eliminar una tarea iniciada o finalizada? ¿Y sus pedidos de materiales?"
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-014-01 a 014-05"
  - "Hipótesis: HIP-TAR-02, HIP-TAR-20"
