id: TAR-UC-003
modulo: TAR
titulo: Ver el detalle de un pedido de trabajo
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-bpm
    path: views/listar_pedidos_trabajo.php
    detalle: verPedido(), verDetallePedido(), showForm()
  - repo: traz-comp-bpm
    path: controllers/Pedidotrabajo.php
    detalle: cargar_detalle_*()
  - repo: traz-comp-bpm
    path: views/pedidos_trabajo/tbl_tareas_planificadas.php
pantallas:
  - Pedidos de Trabajo → Listado → lupa "Ver Pedido"
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Un pedido con hitos y tareas planificadas
depende_de:
  - TAR-UC-002
  - TAR-UC-006
  - TAR-UC-009
flujo_principal:
  - paso: Pulsa la lupa de un pedido
    resultado: Se abre el detalle con Trazabilidad, Comentarios, Información, Formulario y Tareas Planificadas
  - paso: Abre "Tareas Planificadas"
    resultado: Ve los hitos; al expandir uno, sus tareas con estado, asignado, fechas, caso y duración
  - paso: 'En una tarea pulsa "Pedido de Materiales: Ver detalle"'
    resultado: Ve los pedidos de materiales de la tarea
  - paso: 'Pulsa "Formulario Asociado: Ver detalle"'
    resultado: Ve el formulario completado o "Aún no se completó formulario asociado!"
flujos_alternativos:
  - nombre: Pedido sin hitos
    pasos:
      - paso: Abre Tareas Planificadas
        resultado: Ve "No se crearon hitos para este pedido de trabajo."
  - nombre: Hito sin tareas
    pasos:
      - paso: Expande el hito
        resultado: Ve "No se planificaron tareas para este hito."
validaciones:
  - Las horas se muestran en 24 h o con AM/PM
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - ¿Qué debe mostrar la cabecera del detalle para el proceso estándar? El código solo la arma para Yudica y Sein
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-003-01 a 003-06"
  - "Hipótesis: HIP-TAR-18"
