id: TAR-UC-005
modulo: TAR
titulo: Marcar un pedido como Trabajo Terminado
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-bpm
    path: controllers/Pedidotrabajo.php
    detalle: finalizarTrabajo()
  - repo: traz-comp-bpm
    path: views/pedidos_trabajo/lista_pedidos.php
    detalle: finalizarTrabajo()
pantallas:
  - Planificación de Trabajos → ⋮ del pedido → Trabajo Terminado
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Un pedido cuyo caso está en la tarea "Ejecuta el Trabajo - Tools Tareas"
depende_de:
  - TAR-UC-002
flujo_principal:
  - paso: Pulsa "Trabajo Terminado" en el menú del pedido
    resultado: Se cierra esa tarea de Bonita a su nombre y el pedido pasa a Trabajo Terminado, atenuado como "Finalizado"
flujos_alternativos:
  - nombre: El caso no está en la Tarea IT
    pasos:
      - paso: Pulsa "Trabajo Terminado"
        resultado: Ve "El case especificado no se encuentra en el paso de la TAREA IT" y no cambia nada
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - "D-09: ¿se puede marcar Trabajo Terminado con tareas sin finalizar? Hoy no se valida"
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-005-01 a 005-04"
