id: TAR-UC-007
modulo: TAR
titulo: Consultar un hito
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-bpm
    path: controllers/Pedidotrabajo.php
    detalle: hito($id)
  - repo: traz-comp-bpm
    path: views/pedidos_trabajo/detalle_hito.php
  - repo: traz-comp-bpm
    path: views/pedidos_trabajo/lista_hitos.php
    detalle: selectHito()
pantallas:
  - Planificación de Trabajos → ⋮ del hito → Ver Detalle
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Un hito creado
depende_de:
  - TAR-UC-006
flujo_principal:
  - paso: Pulsa "Ver Detalle" en el menú del hito
    resultado: Se abre el hito en solo lectura con los datos guardados, sus tareas y sus pedidos de materiales
validaciones:
  - Solo se ven hitos de la propia empresa
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - "D-12: ¿hace falta editar y eliminar hitos? Hoy no existe en ninguna capa"
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-006-03, 006-07"
  - "Hipótesis: HIP-TAR-02"
