id: TAR-UC-015
modulo: TAR
titulo: Filtrar el calendario por sector y equipo
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-tareasestandar
    path: views/tareas/planificacion_calendario.php
    detalle: agregarFiltro()
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/data-services/TARDataService.dbs
    detalle: /tareas/eventos/empresa/{empr_id}?rec_id_list=
pantallas:
  - Planificación de Trabajos → hito → Calendario → 🏷
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Tareas con equipos asignados
depende_de:
  - TAR-UC-012
flujo_principal:
  - paso: Elige sector y equipo y pulsa 🏷
    resultado: Aparece el filtro y el calendario muestra solo las tareas con ese equipo
  - paso: Quita el filtro
    resultado: Vuelven todas
flujos_alternativos:
  - nombre: Sin sector
    pasos:
      - paso: Pulsa 🏷 sin elegir sector
        resultado: Ve "No se seleccionó un sector."
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - ¿El filtro por equipo tiene uso real en la operación o se puede simplificar?
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-015-01 a 015-03 (no automatizados en esta tanda)"
