id: TAR-UC-004
modulo: TAR
titulo: Eliminar un pedido de trabajo
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-bpm
    path: controllers/Pedidotrabajo.php
    detalle: eliminarPedidoTrabajo()
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/data-services/PRODataService.dbs
    detalle: DELETE /pedidoTrabajo
pantallas:
  - Pedidos de Trabajo → Listado → tacho
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Un pedido de la empresa
depende_de:
  - TAR-UC-002
flujo_principal:
  - paso: Pulsa el tacho
    resultado: 'Se pide confirmación: "Estas Seguro? Esta accion no puede ser revertida!"'
  - paso: Confirma
    resultado: El pedido deja de verse, su caso de Bonita se elimina y ve "Se Elimino Pedido Correctamente!"
flujos_alternativos:
  - nombre: Cancela
    pasos:
      - paso: Cancela la confirmación
        resultado: No cambia nada
validaciones:
  - Borrado lógico del pedido y borrado de su caso
  - Solo se pueden eliminar pedidos de la propia empresa
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - "D-08: al eliminar un pedido, ¿qué pasa con sus hitos, tareas, casos en bandejas y pedidos de materiales? ¿Se impide si hay tareas iniciadas?"
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-004-01 a 004-05"
  - "Hipótesis: HIP-TAR-02, HIP-TAR-08"
