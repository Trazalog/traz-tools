id: TAR-UC-008
modulo: TAR
titulo: Pedir materiales para un hito
perfil: Planificador
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-comp-bpm
    path: views/pedidos_trabajo/mdl_hitos.php
  - repo: traz-comp-almacenes
    path: controllers/Notapedido.php
    detalle: obtenerXOrigen(), nuevo()
pantallas:
  - Planificación de Trabajos → hito → Pedido Materiales → Nuevo Pedido
precondiciones:
  - Sesión iniciada en Tools con perfil Planificador
  - Un hito seleccionado
  - Artículos con stock en un depósito
depende_de:
  - TAR-UC-006
flujo_principal:
  - paso: Con un hito seleccionado, abre "Pedido Materiales" y pulsa "Nuevo Pedido"
    resultado: Se abre el formulario del pedido
  - paso: Agrega artículos y cantidades y guarda
    resultado: El pedido queda asociado al hito y aparece en la lista
flujos_alternativos:
  - nombre: Sin hito seleccionado
    pasos:
      - paso: Pulsa "Nuevo Pedido"
        resultado: Ve "Para crear pedidos debes crear o seleccionar un hito antes"
validaciones:
  - La lista muestra solo los pedidos del hito elegido
datos_prueba:
  empresa: DOCTEST_EMPRESA1 (DocTest Empresa SA)
  datos_base: npm run seed:tar (clientes DT Cliente Norte/Sur, tipos de trabajo DT Mantenimiento/DT Montaje) + pro.procesos PROCESO-STANDAR (seeds/tar/pro-procesos-empresas-test.sql)
  sufijo: los datos que crean los tests llevan el sufijo de la corrida
dudas:
  - "D-13: ¿se mantienen dos lugares para pedir materiales (hito y tarea) con mecanismos de asociación distintos?"
derivados: {}
notas:
  - Relevado desde código en doc/specs/TAR-spec-modulo-tareas.md (2026-10-26) y verificado en el DEMO el 2026-10-27; los resultados de la corrida están en doc/specs/TAR-bugs-detectados.md
  - "Casos de prueba: TAR-CP-008-01 a 008-03 (no automatizados en esta tanda)"
