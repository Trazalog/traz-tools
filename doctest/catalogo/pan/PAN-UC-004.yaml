dudas:
  - "¿Una herramienta puede salir dos veces sin haber vuelto? ¿El sistema lo impide o lo permite?"
  - "El responsable, ¿es un usuario de Tools, un legajo, o texto libre?"
  - "¿La salida cambia el estado de la herramienta? Los estados relevados son solo ACTIVO e INHABILITADO, así que no hay un estado 'entregada' — hay que confirmar cómo se sabe si está en el pañol o afuera."
