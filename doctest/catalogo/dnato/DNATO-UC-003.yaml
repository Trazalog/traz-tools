id: DNATO-UC-003
modulo: DNATO
titulo: Completar el formulario de información adicional del registro
perfil: Administrador
estado: borrador
version: "0.2"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Register.php
    detalle: "register_success() (23-75), guardarFormularioRegistro() (185-246), aplicarEmprIdTemporalRegistro() (76-90)"
  - repo: traz-comp-dnato
    path: application/modules/traz-comp-formularios/models/Forms.php
    detalle: "generarInstancia() / actualizar()"
  - repo: traz-comp-dnato
    path: application/config/constants.php
    detalle: "FORMULARIO_REGISTRO_ID y REGISTER_TEMP_EMPR_ID = 9000 (empresa que guarda las listas de valores del formulario)"
pantallas:
  - "Información Adicional de Registro"
precondiciones:
  - La cuenta fue activada y hay sesión iniciada (DNATO-UC-002)
flujo_principal:
  - paso: "Después de activar la cuenta, ve el formulario de información adicional"
    resultado: "Se muestran las cuatro preguntas con sus opciones"
  - paso: "Elige cómo se enteró de Trazalog, marca a qué se dedica la empresa, elige la cantidad de empleados, describe sus problemas principales y confirma"
    resultado: "Las respuestas quedan guardadas y se continúa con el alta de la empresa"
flujos_alternativos:
  - nombre: "Preguntas obligatorias sin responder"
    pasos:
      - paso: "Confirma sin responder cómo se enteró, a qué se dedica la empresa o cuántos empleados tiene"
        resultado: "El formulario señala las preguntas obligatorias y no avanza"
  - nombre: "No se puede preparar el formulario"
    pasos:
      - paso: "Llega a la pantalla cuando el formulario no se puede generar"
        resultado: "Se muestra 'No se pudo preparar el formulario de registro. Volvé a iniciar sesión o contactá soporte.'"
validaciones:
  - "'¿Cómo te enteraste de Trazalog?' es obligatoria — opción única: Internet, Referencia de otro usuario, Publicidad"
  - "'¿A qué se dedica tu empresa?' es obligatoria — opción múltiple: Industria, Minería, Agricultura, Ganadería, Reciclado, Tecnología, Militar"
  - "'¿Cuántos empleados tiene tu empresa?' es obligatoria — opción única: 1 a 5, 5 a 20, 20 a 40, Más de 40"
  - "'¿Cuáles son los principales problemas que hoy enfrentas?' es de texto libre y opcional"
datos_prueba:
  como_enteraste: "Internet"
  actividad_empresa: "Minería"
  cantidad_empleados: "5 a 20"
dudas:
  - "¿Las respuestas tienen alguna consecuencia funcional (por ejemplo, que marcar 'Minería' o 'Más de 40 empleados' cambie algo del alta, del tier o de lo que ve el usuario después), o son solo información comercial? De eso depende qué tiene que verificar el test además de que se guardó."
notas:
  - "Las cuatro preguntas se relevaron contra el entorno DEMO el 2026-08-19: es un formulario dinámico definido en datos, y el PM confirmó que se toma como estático."
  - "Detalle técnico observado: los nombres de campo llevan el prefijo del empr_id temporal (`9000-como_enteraste`, `9000-cantidad_empleados`), mientras que `actividad_empresa[]` y `problemas_principales` no. Los page objects tienen que contemplarlo."
