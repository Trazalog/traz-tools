id: DNATO-UC-026
modulo: DNATO
titulo: Descargar la plantilla de carga masiva
perfil: Administrador
estado: validado
version: "0.4"
origen: baseline
fecha_validacion: 2026-08-24
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Bulkload.php
    detalle: "descargarTemplate() (711-805): busca la entidad por índice y arma el archivo de ejemplo"
  - repo: traz-comp-dnato
    path: application/models/Bulkloads.php
    detalle: "obtenerEntidadesNegocio() (25+): trae las entidades cargables desde el DataService de CORE. Cada entidad declara además contra qué base corre (`motor_bd`), que es lo que resuelve el despacho de DNATO-UC-027"
  - repo: traz-comp-dnato
    path: application/views/bulkload/index.php
pantallas:
  - "Carga Masiva"
precondiciones:
  - Sesión iniciada con perfil Administrador
flujo_principal:
  - paso: "Abre 'Carga Masiva'"
    resultado: "Se muestran las entidades que se pueden cargar (por ejemplo artículos y herramientas)"
  - paso: "Descarga la plantilla de la entidad que quiere cargar"
    resultado: "Se baja un archivo con las columnas esperadas, para completarlo con los datos"
flujos_alternativos:
  - nombre: "No se pueden obtener las entidades"
    pasos:
      - paso: "Abre la pantalla cuando el servicio que informa las entidades no responde"
        resultado: "Se avisa que se están usando datos de prueba y se muestra una lista mínima"
validaciones:
  - "Las entidades que se pueden cargar salen de una tabla de configuración (`sta.entidades_negocio`), así que la lista crece sin tocar código. Las verificadas en pantalla son Articulos, Herramientas, Stock Articulos, Mantenimiento Equipos y Solicitantes de Transporte; la configuración declara además Mantenimiento Articulos"
  - "La plantilla que se descarga corresponde a la entidad elegida"
datos_prueba: {}
dudas: []
notas:
  - "Validado por el PM el 2026-08-24. Las entidades son 100% configurables desde una tabla, así que la lista va a crecer; el caso se prueba con las tres de hoy."
  - "**Mantenimiento Equipos ya funciona** (2026-09-01). Hasta el 2026-08-31 esa entidad fallaba con \"Stored procedure no encontrado\" porque su procedimiento vive en MariaDB y la carga solo sabía ejecutar contra PostgreSQL. Lo corrigió el PR #34 de `traz-comp-dnato`, que agrega el despacho por motor. Era el hallazgo H-030 / issue #470."
  - "Verificado en pantalla el 2026-08-25: además de las tres que mencionó el PM, la lista ofrece 'Mantenimiento Equipos' (la que falla) y 'Solicitantes de Transporte', que no estaba en la conversación. **Conviene que el PM confirme si esa última corresponde.**"
  - "La pantalla solo verifica que haya sesión iniciada, no que el usuario sea administrador (hallazgo H-029), aunque el menú se la muestre solo a administradores."
derivados:
  ayuda: ayudas/src/dnato/manual_registracion_y_cuenta.html#s09
  test_e2e: tests/e2e/specs/dnato/DNATO-UC-026-027.carga-masiva.spec.ts
  feature: features/dnato/DNATO-UC-026.descargar-la-plantilla-de-carga-masiva.feature
