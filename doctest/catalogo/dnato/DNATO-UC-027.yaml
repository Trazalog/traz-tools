id: DNATO-UC-027
modulo: DNATO
titulo: Cargar datos masivamente desde una planilla
perfil: Administrador
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Bulkload.php
    detalle: "procesarCarga() (152-330): valida entidad y archivo, lo convierte a CSV y lo procesa; mostrarResultado() (670-710)"
  - repo: traz-comp-dnato
    path: application/config/constants.php
    detalle: "BULKLOAD_STAGING_DIR (208): dónde se deja el archivo mientras se procesa"
  - repo: traz-comp-dnato
    path: application/views/bulkload/resultado.php
pantallas:
  - "Carga Masiva"
  - "Resultado de Carga Masiva"
precondiciones:
  - Sesión iniciada con perfil Administrador
  - Se completó la plantilla de la entidad a cargar (DNATO-UC-026)
flujo_principal:
  - paso: "Elige la entidad que va a cargar y adjunta la planilla completada"
    resultado: "El archivo se acepta y comienza el procesamiento"
  - paso: "Confirma la carga"
    resultado: "Se muestra el resultado de la carga con lo que se procesó"
flujos_alternativos:
  - nombre: "Sin elegir la entidad"
    pasos:
      - paso: "Adjunta el archivo sin elegir qué se está cargando"
        resultado: "Se muestra el error de campo obligatorio y no se procesa nada"
  - nombre: "Archivo que no es una planilla"
    pasos:
      - paso: "Adjunta un archivo que no es .xlsx ni .xls"
        resultado: "Se muestra 'Formato de archivo no válido. Solo se permiten archivos Excel (.xlsx, .xls)' y no se procesa nada"
  - nombre: "Sin archivo"
    pasos:
      - paso: "Confirma sin adjuntar ningún archivo"
        resultado: "Se muestra 'Error al cargar el archivo. Verifique que el archivo sea válido.'"
validaciones:
  - "La entidad de negocio es obligatoria"
  - "Solo se aceptan planillas .xlsx o .xls"
dudas:
  - "**Lo más importante y lo que no se puede inferir del código: qué pasa con una planilla que tiene filas con errores.** ¿Se carga todo lo válido y se informa lo que falló, o se rechaza la carga entera? La pantalla de resultado existe, pero qué informa exactamente depende del procedimiento de base que hace el trabajo."
  - "¿La carga es por empresa? El proceso corre con el `empr_id` de la sesión, pero no encontré dónde se valida que los datos del archivo correspondan a esa empresa."
  - "¿Se puede volver atrás una carga equivocada? No hay nada parecido a deshacer en el código."
  - "¿Qué entidades están habilitadas hoy y qué columnas espera cada una?"
notas:
  - "El archivo queda guardado en el servidor (`bulkload_stage_files`) con nombre único mientras se procesa; hay limpieza de temporales."
