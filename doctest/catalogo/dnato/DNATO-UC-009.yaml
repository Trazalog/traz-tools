id: DNATO-UC-009
modulo: DNATO
titulo: Iniciar sesión desde un agente de IA (OAuth 2.1)
perfil: Usuario
estado: validado
version: "0.3"
origen: baseline
fecha_validacion: 2026-08-24
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Oauthlogin.php
    detalle: "index() (44-63) y credentials() (74-155): valida credenciales, resuelve la empresa y emite el code"
  - repo: traz-comp-dnato
    path: application/controllers/Oauth.php
    detalle: "authorize(), token(), jwks(), register_client()"
  - repo: traz-comp-dnato
    path: application/config/routes.php
    detalle: "líneas 60-72: endpoints OAuth 2.1"
pantallas:
  - "Pantalla de ingreso del agente (OAuth) — indica qué aplicación pide acceso"
precondiciones:
  - El cliente OAuth está habilitado en la configuración
  - El usuario tiene rol asignado en al menos una empresa
flujo_principal:
  - paso: "El agente lo redirige a la pantalla de ingreso de Trazalog"
    resultado: "Se muestra el formulario de correo y contraseña, indicando qué aplicación pide el acceso"
  - paso: "Ingresa correo y contraseña y confirma"
    resultado: "Se resuelve su empresa y vuelve al agente ya autorizado"
flujos_alternativos:
  - nombre: "Usuario sin empresa asignada"
    pasos:
      - paso: "Ingresa con una cuenta que no tiene ninguna empresa asignada"
        resultado: "Se muestra que no tiene empresa asignada y que contacte al administrador"
  - nombre: "Usuario con más de una empresa (comportamiento actual)"
    pasos:
      - paso: "Ingresa con una cuenta que tiene más de una empresa asignada"
        resultado: "Se muestra que la configuración no está soportada y que contacte al administrador"
  - nombre: "Credenciales incorrectas"
    pasos:
      - paso: "Ingresa una contraseña equivocada"
        resultado: "Se muestra 'Correo o contraseña incorrectos.'"
  - nombre: "Cuenta inhabilitada"
    pasos:
      - paso: "Ingresa con una cuenta inhabilitada"
        resultado: "Se muestra que la cuenta está temporalmente inhabilitada"
  - nombre: "Sesión del pedido vencida"
    pasos:
      - paso: "Confirma las credenciales cuando el pedido del agente ya venció"
        resultado: "Se muestra que la sesión expiró y que inicie el proceso de nuevo desde el agente"
validaciones:
  - "Solo se aceptan clientes registrados, con response_type=code y code_challenge_method=S256"
  - "El formulario valida un token de seguridad propio antes de aceptar las credenciales"
  - "Hoy la pantalla exige exactamente una empresa por usuario (TAD-IDENT-02)"
datos_prueba:
  empresa: EMPRESA_TEST_1
dudas: []
notas:
  - "⚠️ Cambio previsto en v3 (decisión del PM, 2026-08-19): el ingreso OAuth deja de rechazar a los usuarios con varias empresas — va a mostrar un selector de empresa cuando haya más de una, igual que el login web (ver DNATO-UC-006). Hoy el código corta con error, y la contradicción entre las dos pantallas queda resuelta por esa decisión. Cuando se implemente: bump de `version` y regeneración de derivados en el mismo PR."
  - "Validado por el PM el 2026-08-24."
derivados:
  test_e2e: tests/e2e/specs/dnato/DNATO-UC-009.oauth-agente.spec.ts
  feature: features/dnato/DNATO-UC-009.iniciar-sesion-desde-un-agente-de-ia-oauth-2-1.feature
