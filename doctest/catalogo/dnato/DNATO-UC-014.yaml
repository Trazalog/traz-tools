id: DNATO-UC-014
modulo: DNATO
titulo: Dar de alta un usuario de la empresa
perfil: Administrador
estado: validado
version: "0.4"
origen: baseline
fecha_validacion: 2026-08-24
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "adduser() (224-333)"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "isDuplicate(), crearUsuarioAPI()"
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsCOREAPI.xml
    detalle: "resource POST /usuario (412-628): crea el usuario en core, en users_business, en Bonita y en Asset"
pantallas:
  - "Gestión de Usuarios → Agregar Usuario"
precondiciones:
  - Sesión iniciada con perfil Administrador
  - El correo del nuevo usuario no existe en el sistema
flujo_principal:
  - paso: "Abre 'Agregar Usuario'"
    resultado: "Se muestra el formulario Nuevo Usuario con los campos Nombre, Apellido, Email, Foto de perfil, Teléfono, D.N.I, Empresa, Rol, Contraseña y Confirme Contraseña"
  - paso: "Completa los campos obligatorios y confirma"
    resultado: "El usuario queda creado y se avisa que, para que pueda acceder, hay que asignarle roles desde la acción 'Asignar Rol' de la lista"
flujos_alternativos:
  - nombre: "Correo ya existente"
    pasos:
      - paso: "Completa el formulario con un correo ya registrado"
        resultado: "Se muestra 'Ya existe un usuario asociado a ese Email' y no se crea nada"
  - nombre: "Contraseña que no cumple la política"
    pasos:
      - paso: "Ingresa 'doctest2026' (sin mayúscula ni símbolo)"
        resultado: "Se muestra el error de contraseña y el usuario no se crea"
  - nombre: "Campos obligatorios incompletos"
    pasos:
      - paso: "Confirma sin completar Nombre, Apellido, Email, Empresa o Rol"
        resultado: "Se vuelve a mostrar el formulario con el error"
  - nombre: "Falla el alta en el backend"
    pasos:
      - paso: "Confirma cuando el servicio de alta responde con error"
        resultado: "Se muestra el motivo del error y el usuario no se crea"
validaciones:
  - "Nombre, Apellido, Email, Empresa, Rol, Contraseña y su confirmación son obligatorios; Teléfono, D.N.I y Foto son opcionales"
  - "El correo debe ser válido y no puede estar repetido"
  - "La contraseña exige 10 caracteres, mayúscula, minúscula, dígito y símbolo"
  - "Un usuario recién creado no puede operar hasta que se le asignen roles de empresa (DNATO-UC-018)"
  - "El desplegable de empresas muestra solo aquellas en las que el usuario conectado es administrador"
datos_prueba:
  empresa: EMPRESA_TEST_1
  email_prefijo: "doctest+user-"
  password_valida: "Doctest2026!"
dudas: []
notas:
  - "**Verificado al automatizarlo (2026-08-25): el usuario queda creado pero NO aparece en la Lista de Usuarios**, que es donde la propia pantalla dice ir a asignarle los roles. La lista exige que el usuario ya tenga alguna membresía. El caso describe lo que corresponde —el usuario recién creado tiene que poder verse para completarlo— y el test que lo verifica está marcado como falla conocida (hallazgo H-032, issue #464)."
  - "Verificado en el DEMO el 2026-08-19: las etiquetas con asterisco son Nombre, Apellido, Email, Empresa, Rol, Contraseña y Confirme Contraseña."
  - "Validado por el PM el 2026-08-24 con esa regla. **Hoy el sistema no la cumple**: el desplegable trae todas las empresas del sistema. Registrado como hallazgo H-019."
  - "La etiqueta 'Rol' de este formulario es en realidad el perfil de Dnato: renombrarla queda anotado como mejora (hallazgo H-025), no se toca ahora."
derivados:
  test_e2e: tests/e2e/specs/dnato/DNATO-UC-014.alta-usuario.spec.ts
  feature: features/dnato/DNATO-UC-014.dar-de-alta-un-usuario-de-la-empresa.feature
