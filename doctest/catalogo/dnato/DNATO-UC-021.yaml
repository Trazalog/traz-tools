id: DNATO-UC-021
modulo: DNATO
titulo: Configurar los parámetros del sitio
perfil: Administrador
estado: borrador
version: "0.2"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "settings() (117-177)"
  - repo: traz-comp-dnato
    path: application/views/settings.php
    detalle: "campos id, site_title, timezone, recaptcha, theme"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "getAllSettings(), settings()"
pantallas:
  - "Configuración"
precondiciones:
  - Sesión iniciada con perfil Administrador
flujo_principal:
  - paso: "Abre 'Configuración'"
    resultado: "Se muestran el título del sitio, la zona horaria, el uso de reCAPTCHA y el tema actuales"
  - paso: "Modifica un parámetro y confirma"
    resultado: "Se muestra 'Los datos se actualizaron correctamente.' y el cambio queda aplicado"
flujos_alternativos:
  - nombre: "Campos obligatorios incompletos"
    pasos:
      - paso: "Deja vacío el título, la zona horaria, el reCAPTCHA o el tema y confirma"
        resultado: "Se muestra el error de validación y no se guarda"
  - nombre: "No se puede guardar"
    pasos:
      - paso: "Confirma cuando la actualización falla"
        resultado: "Se muestra 'Hubo un problema al actualizar los datos.'"
validaciones:
  - "Título del sitio, zona horaria, reCAPTCHA y tema son obligatorios"
  - "Solo un administrador accede a esta pantalla"
  - "El interruptor de reCAPTCHA afecta al registro (DNATO-UC-001) y a la recuperación de contraseña (DNATO-UC-008)"
datos_prueba: {}
dudas:
  - "La configuración es una fila única del sistema, no una por empresa: si un administrador de cualquier empresa la cambia, afecta a todos. ¿Tiene que quedar restringida al superusuario?"
notas:
  - "⚠️ Riesgo para la automatización: un test que cambie el interruptor de reCAPTCHA rompe a los tests de registro y recuperación mientras corre. Si se automatiza, tiene que ser un caso serializado (nunca en paralelo) y que restaure el valor original."
  - "Hoy reCAPTCHA está desactivado en el entorno de pruebas (confirmado por el PM el 2026-08-19)."
