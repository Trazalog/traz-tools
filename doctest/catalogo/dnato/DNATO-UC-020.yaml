id: DNATO-UC-020
modulo: DNATO
titulo: Dar de alta un usuario de una empresa externa
perfil: Administrador
estado: borrador
version: "0.2"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "adduserexterno() (772-838)"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "addUserExterno() (523-539): inserta en seg.users con role = USUARIO_EXTERNO y status aprobado"
  - repo: traz-comp-dnato
    path: application/config/constants.php
    detalle: "USUARIO_EXTERNO = 8"
  - repo: traz-comp-dnato
    path: application/views/usuario_externo.php
    detalle: "campos nombre_razon, email, telefono, cuit_empresa, usernick, password"
  - repo: traz-comp-dnato
    path: application/views/list_usuarios_externos.php
    detalle: "listado que filtra por role = USUARIO_EXTERNO"
pantallas:
  - "Alta de usuario externo"
precondiciones:
  - Sesión iniciada con perfil Administrador
flujo_principal:
  - paso: "Abre la pantalla de alta de usuario externo"
    resultado: "Se muestra el formulario con razón social, correo, teléfono, identificador tributario de la empresa externa, nombre de usuario y contraseña"
  - paso: "Completa los datos y confirma"
    resultado: "Se muestra 'El usuario se agregó correctamente.' y vuelve a la lista de usuarios"
flujos_alternativos:
  - nombre: "Correo ya existente"
    pasos:
      - paso: "Completa el formulario con un correo ya registrado"
        resultado: "Se muestra 'El correo del usuario ya existe en el sistema.' y no se crea"
  - nombre: "Contraseña que no cumple la política"
    pasos:
      - paso: "Ingresa una contraseña sin mayúscula, dígito o símbolo"
        resultado: "Se muestra el error de contraseña y el usuario no se crea"
validaciones:
  - "Correo, contraseña y confirmación son obligatorios; el correo no puede repetirse"
  - "El usuario externo se crea con el perfil 'usuario externo' y queda aprobado y habilitado desde el alta"
  - "A diferencia del alta común, no se lo vincula a una empresa del sistema ni se lo crea en el sistema de procesos: lleva la razón social y el identificador tributario de SU empresa"
datos_prueba: {}
dudas:
  - "Interpretación desde el código y los datos: es un usuario que representa a una empresa de afuera (proveedor, transportista, cliente) y por eso guarda razón social y CUIT propios en vez de pertenecer a una empresa del sistema. **¿Es esa la intención de negocio?** Es lo único que me falta confirmar del caso."
  - "La pantalla no está enlazada en el menú de navegación: se llega solo por dirección directa. ¿Sigue en uso o quedó fuera de circulación?"
  - "Al no crearse en Bonita, un usuario externo no tiene roles de trabajo y no podría operar los módulos. ¿Contra qué pantallas se espera que use el sistema?"
notas:
  - "Verificado en el DEMO el 2026-08-19: la pantalla existe y responde en `main/adduserexterno`, con esos seis campos."
