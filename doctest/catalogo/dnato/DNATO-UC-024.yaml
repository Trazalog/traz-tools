id: DNATO-UC-024
modulo: DNATO
titulo: Administrar las opciones de menú del sistema
perfil: Administrador
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Menu.php
    detalle: "menuesList() (56-97), addMenu() (158-205), activeMenu() (206-223), deleteMenu() (246-271)"
  - repo: traz-comp-dnato
    path: application/models/Mmenu.php
    detalle: "getMenues(), addMenues(), updateMenues(), activeMenu(): tabla seg.menues"
  - repo: traz-comp-dnato
    path: application/views/menu/menuesList.php
pantallas:
  - "Gestión de Menúes → Menues"
  - "Listado de Menues"
precondiciones:
  - Sesión iniciada con perfil Administrador
flujo_principal:
  - paso: "Abre 'Menues'"
    resultado: "Se muestra la grilla con Módulo, Opción, Nombre, URL, Opción Padre, Nro. Orden, Texto MouseOver, Javascript, Url Icono y Acciones"
  - paso: "Agrega una opción de menú completando módulo, opción, nombre, URL, opción padre, orden e ícono, y confirma"
    resultado: "Se muestra 'Guardado correctamente el registro.' y la opción aparece en la grilla"
  - paso: "Edita una opción existente y confirma"
    resultado: "Se muestra 'Actualizado correctamente el registro.' con los datos nuevos"
flujos_alternativos:
  - nombre: "Activar o desactivar una opción"
    pasos:
      - paso: "Cambia el estado de una opción de menú"
        resultado: "La opción queda activada o desactivada, y deja de mostrarse a los usuarios cuando está desactivada"
  - nombre: "No se puede guardar"
    pasos:
      - paso: "Confirma cuando la operación falla"
        resultado: "Se muestra 'Error, no se puede guardar el registro'"
  - nombre: "Usuario sin perfil de administración"
    pasos:
      - paso: "Un usuario no administrador abre la dirección"
        resultado: "Se lo redirige a la pantalla principal"
validaciones:
  - "Las opciones de menú son del sistema, no de una empresa: se definen una vez y después se asignan por rol (DNATO-UC-025)"
datos_prueba:
  opcion_prefijo: "DOCTEST-MENU-"
dudas:
  - "¿Qué campos son obligatorios? El controlador no declara reglas de validación: manda lo que llegue del formulario."
  - "Tocar los menúes afecta a lo que ven TODOS los usuarios de TODAS las empresas. ¿Se automatiza el alta y borrado de una opción de prueba, o el caso queda como documentación y prueba manual?"
notas:
  - "Alcance confirmado por el PM el 2026-08-19."
  - "Verificado en el DEMO el 2026-08-19: la grilla y el formulario tienen los campos mencionados."
