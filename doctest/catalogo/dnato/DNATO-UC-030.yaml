id: DNATO-UC-030
modulo: DNATO
titulo: Las pantallas y acciones de administración exigen sesión y permiso
perfil: Visitante
estado: borrador
version: "1.0"
origen: baseline
referencias_codigo:
  - repo: traz-tools
    path: requerimientos/REQ-001-dnato-e0-seguridad.md
    detalle: "Reglas R-1, R-2 y R-3. Se completa con los archivos reales al programar"
  - repo: traz-tools
    path: doc/v3/dnato/01_ESPECIFICACION_FUNCIONAL.md
    detalle: "§9 correctivo C-2 y RF-06; caso de prueba CP-110 en 03_CASOS_DE_PRUEBA.md"
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "Métodos que hoy escriben sin sesión: deleteLevelRolUser (839), changeLevelRolUser (880), changeLevelRolUserObject (947), cambiarNivelUsr (1041), guardarMembership (1090), borrarMembership (1156)"
  - repo: traz-comp-dnato
    path: application/controllers/Menu.php
    detalle: "Constructor sin control de sesión; addMenuRoles, addMenu, activeMenu, activeMenuRole, deleteMenu, deleteMenuRole"
pantallas:
  - "Gestión de Usuarios → Lista de Usuarios"
  - "Menú → Menú por rol"
  - "Empresas"
precondiciones:
  - Existe la empresa de test con su administrador y un usuario sin perfil de administración
flujo_principal:
  - paso: "Sin haber iniciado sesión, abre la dirección de la lista de usuarios"
    resultado: "Se lo lleva a la pantalla de ingreso, sin mostrar ningún dato"
  - paso: "Sin haber iniciado sesión, intenta cambiar el rol de un usuario o guardar un permiso de menú llamando directo a su dirección"
    resultado: "El pedido es rechazado y no cambia nada: el rol y el permiso siguen como estaban"
flujos_alternativos:
  - nombre: "Usuario sin perfil de administración"
    pasos:
      - paso: "Un usuario sin perfil de administración inicia sesión e intenta cambiar el rol de otro usuario o tocar el menú por rol"
        resultado: "Ve 'No tenés permiso para hacer esto. Si lo necesitás, pedíselo al administrador de tu empresa' y no cambia nada"
  - nombre: "Las direcciones de prueba ya no existen"
    pasos:
      - paso: "Abre las direcciones de prueba que hoy mandan correo (email/send, test, test_formularios y los scripts de prueba de correo de la raíz)"
        resultado: "La página no existe y no se envía ningún correo"
  - nombre: "Lo público sigue andando"
    pasos:
      - paso: "Sin sesión, abre la pantalla de ingreso, la de recuperar contraseña y la de registro"
        resultado: "Las tres se ven y funcionan como hoy"
validaciones:
  - "Ninguna dirección de DNATO responde sin sesión, salvo las de ingreso, elegir empresa, recuperar y restablecer contraseña, registro, activación y OAuth"
  - "Ninguna acción de administración responde a un usuario sin perfil de administración"
  - "El control se hace en un único lugar, no método por método"
dudas:
  - "¿Algún sistema llama hoy a estas direcciones sin sesión a propósito (otro servidor, un proceso, AssetPlanner)? En el código no aparece ninguno; si existe, se le arma un acceso propio en vez de dejarlas abiertas."
  - "El rechazo de un pedido de datos sin sesión: ¿alcanza con que no cambie nada y devuelva error (401), o también se quiere que quede registrado el intento? Hoy no existe ningún registro de intentos."
  - "¿Se confirma borrar Email, Test, Test_formularios y los cuatro scripts de prueba de correo de la raíz? Según el relevamiento no los usa nadie (duda 9: ¿están desplegados en PROD?)."
derivados: {}
