id: DNATO-UC-002
modulo: DNATO
titulo: Activar la cuenta y definir la contraseña
perfil: Visitante
estado: borrador
version: "0.2"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "complete() (1271-1361)"
  - repo: traz-comp-dnato
    path: application/libraries/MY_Form_validation.php
    detalle: "password_strong() (35-55): la política real de contraseñas"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "isTokenValid() (111-135): el token vale solo el día en que se generó; updateUserInfo()"
  - repo: traz-comp-dnato
    path: application/views/complete_password.php
pantallas:
  - "Correo 'Activar cuenta en Trazalog.com' → 'Activar mi cuenta'"
  - "Establecer Contraseña"
precondiciones:
  - Existe una cuenta registrada sin contraseña (DNATO-UC-001)
  - El enlace de activación se usa el mismo día en que se generó
flujo_principal:
  - paso: "Abre el enlace de activación recibido por correo"
    resultado: "Se muestra la pantalla para establecer la contraseña, con el nombre y el correo de la cuenta"
  - paso: "Ingresa la contraseña y su confirmación, y confirma"
    resultado: "La cuenta queda activa, se crea el usuario en el sistema de procesos y en Asset Planner, se inicia sesión y se continúa con el formulario de datos de registro"
flujos_alternativos:
  - nombre: "Enlace ya usado o de otro día"
    pasos:
      - paso: "Abre un enlace de activación inválido, o uno generado un día anterior"
        resultado: "Se muestra 'Token invalido o expirado...' y se vuelve a la pantalla de ingreso"
  - nombre: "Contraseña que no cumple la política"
    pasos:
      - paso: "Ingresa 'doctest2026' (10 caracteres, sin mayúscula ni símbolo)"
        resultado: "Se muestra el error de contraseña y la cuenta no se activa"
  - nombre: "Confirmación distinta"
    pasos:
      - paso: "Ingresa una confirmación que no coincide con la contraseña"
        resultado: "Se muestra el error de coincidencia y la contraseña no se guarda"
  - nombre: "La sincronización con el sistema de procesos falla"
    pasos:
      - paso: "Confirma la contraseña cuando el servicio de procesos no responde"
        resultado: "La cuenta queda activada igual y se avisa que no se pudo sincronizar, invitando a continuar"
validaciones:
  - "La contraseña exige 10 caracteres o más, al menos una mayúscula, una minúscula, un dígito y un carácter no alfanumérico"
  - "La confirmación debe coincidir con la contraseña"
  - "El enlace de activación es de un solo uso y vence a la medianoche del día en que se generó"
datos_prueba:
  password_valida: "Doctest2026!"
  password_invalida_sin_simbolo: "Doctest2026"
  password_invalida_corta: "Doct2026!"
dudas:
  - "El vencimiento del token compara la fecha de creación contra la de hoy: si la columna `created` de `seg.tokens` guardara hora, ningún enlace validaría nunca. Como en la práctica las activaciones funcionan, se asume que guarda solo la fecha — conviene confirmarlo contra la base antes de escribir el caso del enlace vencido."
notas:
  - "La política de contraseñas está duplicada en el cliente (`public/js/password-strength.js`) y en el servidor; el propio código avisa que hay que mantener las dos sincronizadas."
