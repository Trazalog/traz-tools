id: DNATO-UC-018
modulo: DNATO
titulo: Asignar y quitar roles de trabajo a un usuario en una empresa
perfil: Administrador
estado: validado
version: "0.3"
origen: baseline
fecha_validacion: 2026-08-24
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "changeleveluser() (334-399) muestra la pantalla; deleteLevelRolUser() (839-879), changeLevelRolUser() (880-902) y changeLevelRolUserObject() (903-991) son los tres endpoints que usa"
  - repo: traz-comp-dnato
    path: application/views/changeleveluser.php
    detalle: "pantalla 'Cambio de Rol': modal 'Agregar Rol' con Empresa + Rol, y tabla 'Roles en el Sistema'"
  - repo: traz-comp-dnato
    path: application/models/Roles.php
    detalle: "getBpmGroups() (empresas) y los roles de Bonita por empresa"
pantallas:
  - "Gestión de Usuarios → Lista de Usuarios → Asignar Rol"
  - "Cambio de Rol"
precondiciones:
  - Sesión iniciada con perfil Administrador
  - El usuario destino existe
  - La empresa tiene creados sus roles de trabajo (los crea el alta de empresa, DNATO-UC-004)
flujo_principal:
  - paso: "Elige 'Asignar Rol' sobre un usuario de la lista"
    resultado: "Se abre 'Cambio de Rol' con el email y el nombre del usuario, su perfil actual y la tabla 'Roles en el Sistema' con los roles que ya tiene por empresa"
  - paso: "Hace clic en 'Agregar Rol', elige la empresa y el rol de trabajo, y acepta"
    resultado: "El rol se suma a la tabla de roles del usuario para esa empresa"
  - paso: "Guarda los cambios"
    resultado: "Se confirma que los roles quedaron asignados y el usuario ya puede entrar a esa empresa con ese rol"
flujos_alternativos:
  - nombre: "Quitar un rol"
    pasos:
      - paso: "Elimina una fila de la tabla 'Roles en el Sistema' y guarda"
        resultado: "El rol deja de figurar y el usuario pierde ese acceso en esa empresa"
  - nombre: "Datos incompletos"
    pasos:
      - paso: "Acepta el modal sin elegir empresa o sin elegir rol"
        resultado: "Se muestra el error y no se agrega nada a la tabla"
  - nombre: "Falla la asignación en el sistema de procesos"
    pasos:
      - paso: "Guarda cuando Bonita responde con error"
        resultado: "Se muestra el error y se revierten las asignaciones de esa operación"
validaciones:
  - "Los roles disponibles se cargan según la empresa elegida — son los roles de Bonita de esa empresa"
  - "Sin al menos un rol en una empresa, el usuario no puede iniciar sesión en ella (ver DNATO-UC-006 y DNATO-UC-014)"
  - "Un mismo usuario puede tener roles en varias empresas a la vez"
  - "No hay combinaciones de roles prohibidas: un usuario puede tener los que haga falta"
datos_prueba:
  empresa: EMPRESA_TEST_1
  rol: "Solicitante de Mantenimiento"
dudas: []
notas:
  - "La pantalla real es `main/changeleveluser/{id}` y maneja en el mismo lugar el perfil de DNATO (DNATO-UC-019) y los roles de trabajo de cada empresa. `changeLevelRolUserObject` guarda las dos cosas juntas, con reversión si falla el sistema de procesos."
  - "Código muerto detectado (hallazgo H6): `Main::associaterol()` carga una vista `membership` que no existe en el repo, y `changelevel.php` / `changeleveluser_old.php` / `changeuser_old` son pantallas anteriores que ya no se enlazan desde el menú."
  - "Verificado en el DEMO: los roles se cargan por empresa vía AJAX al elegirla en el modal; la empresa Conservas devuelve un único rol ('Almacen') por ser anterior al alta automática de 16 roles."
  - "Validado por el PM el 2026-08-24: no existe restricción entre roles."
derivados:
  feature: features/dnato/DNATO-UC-018.asignar-y-quitar-roles-de-trabajo-a-un-usuario-e.feature
