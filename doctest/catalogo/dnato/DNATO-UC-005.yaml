id: DNATO-UC-005
modulo: DNATO
titulo: Ver la pantalla de bienvenida con los usuarios iniciales
perfil: Administrador
estado: borrador
version: "0.1"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Register.php
    detalle: "registro_completo() (800-824) y listaUsuariosDefaultParaBienvenida() (825-850)"
  - repo: traz-comp-dnato
    path: application/views/bienvenida_page.php
pantallas:
  - "Registro Completado"
precondiciones:
  - La empresa fue creada correctamente (DNATO-UC-004)
flujo_principal:
  - paso: "Termina el alta de la empresa"
    resultado: "Se muestra la pantalla de bienvenida con la lista de usuarios iniciales de la empresa, sus roles y la contraseña con la que fueron creados"
  - paso: "Hace clic en 'Ir a iniciar sesión'"
    resultado: "Se cierra la sesión del registro y se muestra la pantalla de ingreso, donde ya puede elegir su empresa"
flujos_alternativos:
  - nombre: "El alta terminó con advertencias"
    pasos:
      - paso: "Llega a la bienvenida cuando alguna parte de la configuración inicial dejó advertencias"
        resultado: "Se muestran las advertencias junto con la lista de usuarios"
validaciones:
  - "La sesión del registro se cierra al llegar a esta pantalla, para que el ingreso siguiente sea con selección de empresa"
datos_prueba: {}
dudas:
  - "¿La pantalla debe seguir mostrando la contraseña inicial de los usuarios? Es el mismo hallazgo que DNATO-UC-004 y afecta a qué se puede capturar en las pruebas (los reportes de Playwright guardan capturas)."
  - "¿Se espera que el administrador cambie esas contraseñas antes de operar? Si es así, no encontré dónde se le exige."
