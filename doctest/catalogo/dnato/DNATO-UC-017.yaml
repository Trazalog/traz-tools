id: DNATO-UC-017
modulo: DNATO
titulo: Eliminar un usuario de la empresa
perfil: Administrador
estado: borrador
version: "0.2"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "deleteuser() (693-741): bloquea si el usuario tiene roles, después borra el vínculo con la empresa y el usuario"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "getMembershipsUserInfoEmpresa(); deleteUserBusines() (784-795) hace DELETE en seg.users_business; deleteUser() (770-781) hace DELETE en seg.users"
  - repo: traz-comp-dnato
    path: application/views/usersList.php
    detalle: "acción 'Eliminar Usuario' con modal Confirmar / Cancelar"
pantallas:
  - "Gestión de Usuarios → Lista de Usuarios → Eliminar Usuario"
precondiciones:
  - Sesión iniciada con perfil Administrador
  - El usuario a eliminar no tiene roles de trabajo asignados en esa empresa
flujo_principal:
  - paso: "Elige 'Eliminar Usuario' sobre un usuario sin roles asignados"
    resultado: "Se pide confirmación antes de hacer nada"
  - paso: "Confirma"
    resultado: "Se muestra 'Eliminado Correctamente.' y el usuario desaparece de la lista"
flujos_alternativos:
  - nombre: "El usuario todavía tiene roles asignados"
    pasos:
      - paso: "Elige 'Eliminar Usuario' sobre un usuario con roles en la empresa"
        resultado: "Se muestra 'Error, Este usuario tiene roles de sistema en la empresa asignados!' y no se elimina"
  - nombre: "Cancelar la confirmación"
    pasos:
      - paso: "Elige 'Eliminar Usuario' y cancela en el pedido de confirmación"
        resultado: "No se elimina nada y el usuario sigue en la lista"
  - nombre: "No se puede desvincular de la empresa"
    pasos:
      - paso: "Confirma la eliminación cuando falla la baja del vínculo con la empresa"
        resultado: "Se muestra el error indicando el correo del usuario y no se elimina"
validaciones:
  - "Un usuario con roles de trabajo asignados en la empresa no puede eliminarse: primero hay que quitarle los roles (DNATO-UC-018)"
  - "La acción pide confirmación antes de ejecutarse"
dudas:
  - "🔴 El PM entendía que la baja era lógica y **el código hace borrado físico**: `DELETE` sobre `seg.users_business` y después `DELETE` sobre `seg.users` (hallazgo H2). Además no da de baja al usuario ni en Bonita ni en Asset Planner, así que queda huérfano ahí. Antes de escribir el test hay que decidir si el comportamiento esperado es el actual o si esto se corrige: el caso de uso describiría cosas distintas."
  - "Con borrado físico, la baja lógica que existe hoy es 'inhabilitar' (DNATO-UC-016). ¿La pantalla debería llamar a esta acción 'Eliminar definitivamente' para que el administrador entienda la diferencia?"
datos_prueba: {}
notas:
  - "Este caso queda deliberadamente sin derivar hasta que se resuelva la duda: automatizar un borrado físico contra el entorno de pruebas necesita además decidir qué usuario se sacrifica en cada corrida."
