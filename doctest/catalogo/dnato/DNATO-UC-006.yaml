id: DNATO-UC-006
modulo: DNATO
titulo: Iniciar sesión eligiendo la empresa
perfil: Usuario
estado: validado
version: "0.3"
origen: baseline
fecha_validacion: 2026-08-24
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "login() (1362-1475)"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "chekEmpresa(), checkLogin()"
  - repo: traz-comp-dnato
    path: application/views/login.php
pantallas:
  - "Bienvenido! Ingrese por favor"
precondiciones:
  - Sin sesión iniciada
  - La cuenta está activada y habilitada
  - El usuario tiene rol asignado en la empresa que elige
flujo_principal:
  - paso: "Abre la pantalla de ingreso"
    resultado: "Se muestra el formulario con la lista de empresas, correo y contraseña"
  - paso: "Elige su empresa, ingresa correo y contraseña, y confirma"
    resultado: "Inicia sesión y entra a Trazalog Tools con esa empresa como empresa activa"
flujos_alternativos:
  - nombre: "El usuario no pertenece a la empresa elegida"
    pasos:
      - paso: "Elige una empresa en la que no tiene roles e ingresa sus credenciales"
        resultado: "Se muestra 'El usuario no corresponde a la empresa seleccionada.' y no inicia sesión"
  - nombre: "Correo o contraseña incorrectos"
    pasos:
      - paso: "Ingresa una contraseña equivocada"
        resultado: "Se muestra 'Correo o contraseña incorrectos.' y no inicia sesión"
  - nombre: "Usuario inhabilitado"
    pasos:
      - paso: "Ingresa credenciales correctas de una cuenta inhabilitada"
        resultado: "Se muestra que está temporalmente inhabilitado para el sistema y no inicia sesión"
  - nombre: "Campos vacíos"
    pasos:
      - paso: "Confirma sin completar correo o contraseña"
        resultado: "Se vuelve a mostrar la pantalla de ingreso con el error de validación"
  - nombre: "El usuario no existe en el sistema de procesos"
    pasos:
      - paso: "Ingresa con una cuenta que no tiene usuario en Bonita"
        resultado: "Se muestra 'Error de inicio de sesión en BPM.' y no inicia sesión"
validaciones:
  - "Correo y contraseña son obligatorios; el correo debe tener formato válido"
  - "Un usuario puede pertenecer a varias empresas y elige con cuál entra"
  - "La pertenencia a la empresa elegida se verifica antes de validar la contraseña"
  - "Una cuenta inhabilitada no puede iniciar sesión aunque la contraseña sea correcta"
datos_prueba:
  empresa: EMPRESA_TEST_1
dudas: []
notas:
  - "Confirmado contra el DEMO: un usuario puede tener roles en varias empresas (el usuario de prueba tiene seis)."
  - "⚠️ Cambio previsto en v3 (decisión del PM, 2026-08-19): se elimina el desplegable de empresas de esta pantalla. Se valida primero el usuario y, si tiene más de una empresa, recién ahí se le muestra un selector; si tiene una sola, entra directo. Cuando eso se implemente, este caso cambia de comportamiento: hay que subir su `version` y regenerar sus derivados en el mismo PR (regla R6 del validador)."
  - "El combo actual lista todas las empresas del sistema a cualquiera que abra el login, sin sesión (hallazgo H4). El cambio de v3 lo resuelve de paso."
  - "Validado por el PM el 2026-08-24: este es el único login unificado del sistema."
derivados:
  ayuda: ayudas/src/dnato/manual_registracion_y_cuenta.html#s05
  test_e2e: tests/e2e/specs/dnato/DNATO-UC-006.iniciar-sesion.spec.ts
  feature: features/dnato/DNATO-UC-006.iniciar-sesion-eligiendo-la-empresa.feature
