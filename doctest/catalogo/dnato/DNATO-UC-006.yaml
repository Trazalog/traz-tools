id: DNATO-UC-006
modulo: DNATO
titulo: Iniciar sesión eligiendo la empresa
perfil: Usuario
estado: validado
version: "0.4"
origen: baseline
fecha_validacion: 2026-09-04
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "login() (paso 1) y seleccionar_empresa() / _confirmarEmpresa() / _finalizarLogin() (paso 2)"
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "getEmpresasDeUsuario(), chekEmpresaByEmprId(), checkLogin()"
  - repo: traz-comp-dnato
    path: application/views/login.php
    detalle: "paso 1 — sólo correo y contraseña"
  - repo: traz-comp-dnato
    path: application/views/login_empresa.php
    detalle: "paso 2 — tarjetas de empresa"
pantallas:
  - "Bienvenido"
  - "¿Con qué empresa querés ingresar?"
precondiciones:
  - Sin sesión iniciada
  - La cuenta está activada y habilitada
  - El usuario tiene al menos una empresa con membresía resoluble
flujo_principal:
  - paso: "Abre la pantalla de ingreso"
    resultado: "Se muestra el formulario con dos campos: correo y contraseña. No se ofrece ninguna lista de empresas"
  - paso: "Ingresa correo y contraseña, y confirma"
    resultado: "Se validan las credenciales y el sistema resuelve por su cuenta a qué empresas pertenece el usuario"
  - paso: "Si pertenece a una sola empresa, no hace nada más"
    resultado: "Inicia sesión con esa empresa como empresa activa y entra a Trazalog Tools"
  - paso: "Si pertenece a más de una, elige una de las empresas que se le muestran"
    resultado: "Inicia sesión con la empresa elegida como empresa activa y entra a Trazalog Tools"
flujos_alternativos:
  - nombre: "Correo o contraseña incorrectos"
    pasos:
      - paso: "Ingresa una contraseña equivocada"
        resultado: "Se muestra 'Correo o contraseña incorrectos.' y no inicia sesión"
  - nombre: "El usuario no tiene ninguna empresa"
    pasos:
      - paso: "Ingresa credenciales correctas de una cuenta sin membresías resolubles"
        resultado: "Se muestra que no tiene ninguna empresa asignada y que contacte al administrador, y no inicia sesión"
  - nombre: "Se intenta llegar a la elección de empresa sin haber ingresado"
    pasos:
      - paso: "Abre la pantalla de elección de empresa por dirección directa, sin credenciales validadas"
        resultado: "Se muestra 'Tu sesión expiró. Ingresá nuevamente.' y vuelve a la pantalla de ingreso"
  - nombre: "Se confirma una empresa que no es del usuario"
    pasos:
      - paso: "Se envía la elección con una empresa en la que el usuario no tiene membresía"
        resultado: "Se muestra que la empresa seleccionada no corresponde a su usuario, se descarta el ingreso a medias y vuelve a la pantalla de ingreso"
  - nombre: "Usuario inhabilitado"
    pasos:
      - paso: "Ingresa credenciales correctas de una cuenta inhabilitada"
        resultado: "Se muestra que está temporalmente inhabilitado para el sistema y no inicia sesión"
  - nombre: "Campos vacíos"
    pasos:
      - paso: "Confirma sin completar correo o contraseña"
        resultado: "Se vuelve a mostrar la pantalla de ingreso con el error de validación"
  - nombre: "El usuario no existe en el sistema de procesos"
    pasos:
      - paso: "Ingresa con una cuenta que no tiene usuario en Bonita"
        resultado: "Se muestra 'Error de inicio de sesión en BPM.' y no inicia sesión"
validaciones:
  - "Correo y contraseña son obligatorios; el correo debe tener formato válido"
  - "Las credenciales se validan ANTES que cualquier otra cosa: nada del sistema se revela a quien no se autenticó"
  - "La pantalla de ingreso no expone ninguna empresa: sin sesión no se puede saber qué empresas existen"
  - "Las empresas de un usuario las resuelve el servidor a partir de sus membresías; nunca llegan desde el formulario"
  - "Un usuario puede pertenecer a varias empresas y elige con cuál entra, pero sólo entre las suyas"
  - "Con una sola empresa no se pide elegir: entra directo"
  - "La empresa confirmada se vuelve a verificar contra la base antes de abrir la sesión"
  - "La elección de empresa exige credenciales ya validadas y un token de seguridad propio del formulario"
  - "Una cuenta inhabilitada no puede iniciar sesión aunque la contraseña sea correcta"
datos_prueba:
  empresa: EMPRESA_TEST_1
dudas: []
notas:
  - "Versión 0.4 (2026-09-04): implementado el cambio de dos pasos que este caso ya anticipaba. Entró por el PR #26 de traz-comp-dnato y está desplegado en DEMO como v2.5.0.2. Se actualizó el caso contra el comportamiento real verificado en ese entorno; la decisión funcional de fondo es la del PM del 2026-08-19, ya registrada acá abajo."
  - "Decisión del PM (2026-08-19): se elimina el desplegable de empresas de la pantalla de ingreso. Se valida primero el usuario y, si tiene más de una empresa, recién ahí se le muestran para elegir; si tiene una sola, entra directo."
  - "Cierra el hallazgo H4: el desplegable viejo listaba TODAS las empresas del sistema a cualquiera que abriera el login sin sesión. También cierra dos problemas que no estaban documentados: la pertenencia se verificaba ANTES que la contraseña (permitía averiguar si un correo pertenecía a una empresa sin credenciales) y el empr_id llegaba desde el POST del cliente."
  - "El escenario viejo 'El usuario no pertenece a la empresa elegida' se retiró porque dejó de ser reproducible desde la interfaz: ya no se elige empresa antes de autenticarse, y en el paso 2 sólo se ofrecen las empresas propias. El control equivalente sigue existiendo del lado del servidor y quedó cubierto por los dos escenarios nuevos de acceso directo y de confirmación de una empresa ajena."
  - "Confirmado contra el DEMO: un usuario puede tener roles en varias empresas (el usuario de prueba tenía seis)."
  - "Validado por el PM el 2026-08-24: este es el único login unificado del sistema. El login OAuth para agentes (DNATO-UC-009) es una pantalla aparte y sigue rechazando usuarios multi-empresa (TAD-IDENT-02); las dos NO comparten código."
derivados:
