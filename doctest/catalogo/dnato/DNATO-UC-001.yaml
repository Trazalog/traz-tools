id: DNATO-UC-001
modulo: DNATO
titulo: Registrar una empresa nueva (paso 1 - datos de contacto)
perfil: Visitante
estado: borrador
version: "0.2"
origen: baseline
referencias_codigo:
  - repo: traz-comp-dnato
    path: application/controllers/Main.php
    detalle: "register() (1138-1237) y procesarRegistro() (1642-1793)"
  - repo: traz-comp-dnato
    path: application/views/register.php
  - repo: traz-comp-dnato
    path: application/models/User_model.php
    detalle: "isDuplicate(), existeRazonSocial(), validarTelefonoPorPais(), obtenerPaisesRegistracion()"
  - repo: traz-tools
    path: _backend/api/ToolsAPIProject/ToolsAPIProject/src/main/wso2mi/artifacts/apis/toolsCOREAPI.xml
    detalle: "resource POST /usuario/registro (líneas 629-745): verifica duplicado, inserta el usuario y guarda el token de activación"
pantallas:
  - "Login → 'No esta registrado? Registrese por favor'"
  - "Registro Nuevo Usuario"
precondiciones:
  - Sin sesión iniciada
  - El correo no está registrado en el sistema
  - La razón social no existe todavía para ese país
flujo_principal:
  - paso: "Desde la pantalla de ingreso hace clic en 'Registrese por favor'"
    resultado: "Se abre el formulario de registro con la lista de países disponibles"
  - paso: "Completa Nombre, Apellido, Correo electrónico, Razón Social de la Empresa, Teléfono y País, y confirma"
    resultado: "Se crea la cuenta sin contraseña y con perfil Administrador, se muestra 'Registro exitoso! Revise su email para activar su cuenta.' y llega el correo 'Activar cuenta en Trazalog.com' con el enlace de activación"
flujos_alternativos:
  - nombre: "Correo ya registrado"
    pasos:
      - paso: "Completa el formulario con un correo que ya existe en el sistema"
        resultado: "Se muestra 'El email que intenta registrar ya existe...' y la cuenta no se crea"
  - nombre: "Razón social repetida en el mismo país"
    pasos:
      - paso: "Completa el formulario con una razón social ya existente para el país elegido"
        resultado: "Se muestra 'La Razón Social ingresada ya existe en el sistema para el país solicitado' y la cuenta no se crea"
  - nombre: "Teléfono con formato inválido para el país"
    pasos:
      - paso: "Ingresa un teléfono que no cumple el formato del país seleccionado"
        resultado: "Se muestra 'El formato del teléfono no es válido para el país seleccionado.' y la cuenta no se crea"
  - nombre: "Campos obligatorios incompletos"
    pasos:
      - paso: "Confirma el formulario sin completar alguno de los seis campos"
        resultado: "El formulario se vuelve a mostrar con el error del campo y conserva lo ya cargado"
validaciones:
  - "Nombre, Apellido, Correo, Razón Social, Teléfono y País son obligatorios"
  - "El correo debe tener formato válido y no puede estar registrado"
  - "La razón social no puede repetirse dentro del mismo país"
  - "El teléfono se valida según el país elegido"
  - "Quien se auto-registra queda con perfil Administrador de su empresa"
datos_prueba:
  email_prefijo: "doctest+reg-"
  razon_social_prefijo: "DOCTEST SA "
  nota_recaptcha: "reCAPTCHA está desactivado en el entorno de pruebas (decisión del PM, 2026-08-19): el flujo es automatizable de punta a punta"
dudas:
  - "El correo de la persona que se registra tiene que llegar a una casilla que el test pueda leer, porque el enlace de activación (DNATO-UC-002) solo llega por mail. Falta definir esa casilla — ver §3 del RESUMEN."
  - "Si el envío del mail falla, el usuario queda creado igual y el enlace solo queda en el log del servidor. ¿Es el comportamiento buscado o debería poder reenviarse desde la pantalla?"
notas:
  - "Decisión del PM (2026-08-19): la automatización va contra una empresa de test descartable y se acepta la basura acumulada, con re-seed periódico. Queda pendiente construir un procedimiento de limpieza."
